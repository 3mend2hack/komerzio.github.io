    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .success-card {
            background: white; border-radius: 30px; padding: 50px;
            max-width: 500px; width: 100%; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success-icon {
            width: 100px; height: 100px; background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 50px; margin: 0 auto 30px;
            animation: scaleIn 0.5s ease;
        }
        @keyframes scaleIn {
            0% { transform: scale(0); }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #0f172a;
        }
        .subtitle {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.6;
        }
        .amount-display {
            background: #f0fdf4;
            border: 2px solid #86efac;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
        }
        .amount-display .label {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }
        .amount-display .amount {
            font-size: 48px;
            font-weight: 800;
            color: #059669;
            display: block;
            margin-top: 5px;
        }
        .amount-display .amount small {
            font-size: 18px;
            font-weight: 500;
        }
        .saldo-info {
            font-size: 14px;
            color: #64748b;
            margin: 15px 0 25px;
        }
        .saldo-info strong {
            color: #0f172a;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 30px;
            border-radius: 40px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            flex: 1;
            justify-content: center;
            min-width: 140px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            box-shadow: 0 4px 12px rgba(249,115,22,0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(249,115,22,0.4);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #0f172a;
            border: 1px solid #e2e8f0;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
        }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 640px) {
            .success-card { padding: 30px 20px; }
            h1 { font-size: 24px; }
            .amount-display .amount { font-size: 36px; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
        }
        @media (max-width: 480px) {
            .success-card { padding: 24px 16px; }
            h1 { font-size: 20px; }
            .amount-display .amount { font-size: 28px; }
            .success-icon { width: 70px; height: 70px; font-size: 32px; }
        }

<body>
    <div class="success-card">
        <div class="success-icon"><i class="fa fa-check"></i></div>
        <h1>🎉 ¡Recarga Exitosa!</h1>
        <p class="subtitle">Tu saldo ha sido acreditado correctamente</p>
        
        <div id="loadingContent" class="loading">
            <i class="fa fa-spinner spinner"></i>
            <p>Cargando información...</p>
        </div>
        
        <div id="mainContent" style="display: none;">
            <div class="amount-display">
                <span class="label">Monto recargado</span>
                <span class="amount" id="montoRecargado">$0.00 <small>USD</small></span>
            </div>
            <div class="saldo-info">
                <i class="fa fa-wallet"></i>
                Nuevo saldo: <strong id="nuevoSaldo">$0.00 USD</strong>
            </div>
        </div>
        
        <div class="btn-group">
            <a href="/" class="btn btn-primary"><i class="fa fa-shopping-cart"></i> Seguir comprando</a>
            <a href="/mi-cuenta.html" class="btn btn-secondary"><i class="fa fa-user"></i> Mi cuenta</a>
        </div>
    </div>

    <!-- ========== SCRIPTS ========== -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Configuración de Supabase -->
    <script src="/js/komerzio-config.js"></script>

    <script type="module">
        // ============================================================
        // IMPORTAR CONFIGURACIÓN DE SUPABASE
        // ============================================================
        import { supabase } from '/js/supabase-client.js';
        import { auth } from '/js/auth.js';
        
        console.log('✅ recarga-exitosa.html - Inicializado con Supabase');
        
        // ============================================================
        // OBTENER PARÁMETROS DE LA URL
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const montoParam = urlParams.get('monto');
        const metodoParam = urlParams.get('metodo') || 'usdt';
        
        // ============================================================
        // FUNCIONES AUXILIARES
        // ============================================================
        function formatearMonto(monto) {
            if (!monto) return '0.00';
            return parseFloat(monto).toFixed(2);
        }
        
        // ============================================================
        // CARGAR INFORMACIÓN
        // ============================================================
        async function cargarInformacion() {
            const loadingContent = document.getElementById('loadingContent');
            const mainContent = document.getElementById('mainContent');
            const montoElement = document.getElementById('montoRecargado');
            const saldoElement = document.getElementById('nuevoSaldo');
            
            let monto = montoParam;
            
            // Si no hay monto en URL, intentar obtenerlo de la sesión o del usuario
            if (!monto) {
                const usuario = auth.getUsuario();
                if (usuario) {
                    try {
                        const { data, error } = await supabase
                            .from('saldo_usuarios')
                            .select('saldo_actual')
                            .eq('user_id', usuario.id)
                            .maybeSingle();
                        
                        if (!error && data) {
                            // El monto recargado se puede obtener de la última transacción
                            const { data: historial } = await supabase
                                .from('historial_saldo')
                                .select('monto')
                                .eq('user_id', usuario.id)
                                .eq('tipo', 'recarga')
                                .order('created_at', { ascending: false })
                                .limit(1);
                            
                            if (historial && historial.length > 0) {
                                monto = Math.abs(historial[0].monto);
                            }
                            
                            saldoElement.textContent = `$${data.saldo_actual.toFixed(2)} USD`;
                        }
                    } catch (error) {
                        console.error('Error cargando saldo:', error);
                    }
                }
            }
            
            // Mostrar monto
            if (monto) {
                montoElement.innerHTML = `$${formatearMonto(monto)} <small>USD</small>`;
            } else {
                montoElement.innerHTML = `$0.00 <small>USD</small>`;
            }
            
            // Cargar saldo actual del usuario
            const usuario = auth.getUsuario();
            if (usuario) {
                try {
                    const { data, error } = await supabase
                        .from('saldo_usuarios')
                        .select('saldo_actual')
                        .eq('user_id', usuario.id)
                        .maybeSingle();
                    
                    if (!error && data) {
                        saldoElement.textContent = `$${data.saldo_actual.toFixed(2)} USD`;
                    }
                } catch (error) {
                    console.error('Error cargando saldo:', error);
                }
            }
            
            // Ocultar loading y mostrar contenido
            loadingContent.style.display = 'none';
            mainContent.style.display = 'block';
        }
        
        // ============================================================
        // INICIALIZAR
        // ============================================================
        setTimeout(() => {
            cargarInformacion();
        }, 500);
    </script>
</body>
