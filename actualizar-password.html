    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo .logo-text {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #f97316, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo .lock-icon {
            font-size: 48px;
            color: #f97316;
            display: block;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0f172a;
        }
        p.subtitle {
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #0f172a;
            font-size: 14px;
        }
        .form-group label i {
            color: #f97316;
            margin-right: 6px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
        }
        input {
            width: 100%;
            padding: 12px 15px 12px 44px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            background: #f8fafc;
        }
        input:focus {
            border-color: #f97316;
            outline: none;
            box-shadow: 0 0 0 4px rgba(249,115,22,0.1);
            background: white;
        }
        input::placeholder {
            color: #94a3b8;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(249,115,22,0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .alert {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .alert-success {
            background: #dcfce7;
            color: #166534;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid #86efac;
        }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid #fca5a5;
        }
        .alert i { font-size: 18px; }
        .back-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        .back-link a {
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-link a:hover { color: #f97316; }
        .password-strength {
            margin-top: 8px;
            font-size: 12px;
            color: #94a3b8;
        }
        .password-strength .bar {
            height: 4px;
            border-radius: 2px;
            background: #e2e8f0;
            margin-top: 4px;
            overflow: hidden;
        }
        .password-strength .bar .fill {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: width 0.3s;
        }
        .success-icon {
            display: block;
            font-size: 64px;
            color: #10b981;
            margin: 0 auto 20px;
            text-align: center;
        }
        @media (max-width: 480px) {
            .container { padding: 30px 20px; border-radius: 16px; }
            h1 { font-size: 22px; }
            input { font-size: 14px; padding: 10px 15px 10px 38px; }
            .btn { font-size: 15px; padding: 12px; }
        }

</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="lock-icon">🔐</span>
            <span class="logo-text">KOMERZIO</span>
        </div>
        
        <h1>Actualizar contraseña</h1>
        <p class="subtitle">Ingresa tu nueva contraseña para acceder a tu cuenta</p>
        
        <div id="alertMessage" class="alert"></div>
        
        <div id="successState" style="display: none; text-align: center; padding: 20px 0;">
            <span class="success-icon">✅</span>
            <h2 style="font-size: 22px; color: #0f172a; margin-bottom: 8px;">¡Contraseña actualizada!</h2>
            <p style="color: #64748b; font-size: 14px;">Tu contraseña ha sido cambiada exitosamente.</p>
            <p style="color: #64748b; font-size: 14px; margin-top: 5px;">Redirigiendo al inicio de sesión...</p>
        </div>
        
        <form id="updateForm">
            <div class="form-group">
                <label><i class="fa fa-lock"></i> Nueva contraseña</label>
                <div class="input-wrapper">
                    <i class="fa fa-key"></i>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
                </div>
                <div class="password-strength" id="strengthIndicator">
                    <span>Debilidad: <span id="strengthText">Muy débil</span></span>
                    <div class="bar">
                        <div class="fill" id="strengthBar"></div>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label><i class="fa fa-check-circle"></i> Confirmar contraseña</label>
                <div class="input-wrapper">
                    <i class="fa fa-check"></i>
                    <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required autocomplete="new-password">
                </div>
            </div>
            
            <button type="submit" class="btn" id="submitBtn">
                <i class="fa fa-save"></i> Actualizar contraseña
            </button>
            
            <div class="back-link">
                <a href="/login.html">
                    <i class="fa fa-arrow-left"></i> Volver al inicio de sesión
                </a>
            </div>
        </form>
    </div>

    <!-- ========== SCRIPTS ========== -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Configuración de Supabase -->
    <script src="/js/komerzio-config.js"></script>

    <script type="module">
        // ============================================================
        // IMPORTAR CONFIGURACIÓN DE SUPABASE
        // ============================================================
        import { supabase } from '/js/supabase-client.js';
        
        console.log('✅ actualizar-password.html - Inicializado con Supabase');
        
        // ============================================================
        // REFERENCIAS DOM
        // ============================================================
        const form = document.getElementById('updateForm');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const alertDiv = document.getElementById('alertMessage');
        const successState = document.getElementById('successState');
        const strengthText = document.getElementById('strengthText');
        const strengthBar = document.getElementById('strengthBar');

        // ============================================================
        // VERIFICAR SESIÓN VÁLIDA
        // ============================================================
        async function verificarSesion() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                
                if (!session) {
                    alertDiv.className = 'alert alert-error';
                    alertDiv.innerHTML = '<i class="fa fa-exclamation-circle"></i> Enlace inválido o expirado. Solicita un nuevo enlace de recuperación.';
                    form.style.display = 'none';
                    document.querySelector('.back-link').style.display = 'none';
                    return false;
                }
                
                console.log('✅ Sesión válida para actualizar contraseña');
                return true;
            } catch (error) {
                console.error('Error verificando sesión:', error);
                alertDiv.className = 'alert alert-error';
                alertDiv.innerHTML = '<i class="fa fa-exclamation-circle"></i> Error al verificar la sesión. Intenta de nuevo.';
                return false;
            }
        }

        // ============================================================
        // MEDIDOR DE FORTALEZA DE CONTRASEÑA
        // ============================================================
        function medirFortaleza(password) {
            let score = 0;
            
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^a-zA-Z0-9]/.test(password)) score++;
            
            return Math.min(score, 5);
        }

        function actualizarFortaleza(password) {
            const score = medirFortaleza(password);
            const porcentaje = (score / 5) * 100;
            
            strengthBar.style.width = `${porcentaje}%`;
            
            const colores = ['#dc2626', '#f59e0b', '#f59e0b', '#22c55e', '#22c55e', '#10b981'];
            strengthBar.style.background = colores[score];
            
            const textos = ['Muy débil', 'Débil', 'Media', 'Fuerte', 'Muy fuerte', 'Excelente'];
            strengthText.textContent = textos[score];
            strengthText.style.color = colores[score];
        }

        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            if (password.length > 0) {
                actualizarFortaleza(password);
            } else {
                strengthBar.style.width = '0%';
                strengthText.textContent = 'Muy débil';
                strengthText.style.color = '#94a3b8';
            }
        });

        // ============================================================
        // MANEJAR ENVÍO DEL FORMULARIO
        // ============================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            
            // Validar
            if (password !== confirm) {
                alertDiv.className = 'alert alert-error';
                alertDiv.innerHTML = '<i class="fa fa-exclamation-circle"></i> Las contraseñas no coinciden';
                alertDiv.style.display = 'flex';
                confirmInput.focus();
                return;
            }
            
            if (password.length < 6) {
                alertDiv.className = 'alert alert-error';
                alertDiv.innerHTML = '<i class="fa fa-exclamation-circle"></i> La contraseña debe tener al menos 6 caracteres';
                alertDiv.style.display = 'flex';
                passwordInput.focus();
                return;
            }
            
            // Ocultar alerta
            alertDiv.style.display = 'none';
            
            // Deshabilitar botón
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Actualizando...';
            
            try {
                const { error } = await supabase.auth.updateUser({
                    password: password
                });
                
                if (error) {
                    console.error('Error actualizando contraseña:', error);
                    alertDiv.className = 'alert alert-error';
                    alertDiv.innerHTML = `<i class="fa fa-exclamation-circle"></i> ${error.message || 'Error al actualizar la contraseña'}`;
                    alertDiv.style.display = 'flex';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa fa-save"></i> Actualizar contraseña';
                    return;
                }
                
                // Éxito
                form.style.display = 'none';
                successState.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 3000);
                
            } catch (error) {
                console.error('Error inesperado:', error);
                alertDiv.className = 'alert alert-error';
                alertDiv.innerHTML = '<i class="fa fa-exclamation-circle"></i> Ocurrió un error inesperado. Intenta de nuevo.';
                alertDiv.style.display = 'flex';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa fa-save"></i> Actualizar contraseña';
            }
        });

        // ============================================================
        // VALIDACIÓN EN TIEMPO REAL
        // ============================================================
        confirmInput.addEventListener('input', () => {
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            
            if (confirm.length > 0) {
                if (password === confirm) {
                    confirmInput.style.borderColor = '#22c55e';
                } else {
                    confirmInput.style.borderColor = '#dc2626';
                }
            } else {
                confirmInput.style.borderColor = '#e2e8f0';
            }
        });

        passwordInput.addEventListener('input', () => {
            passwordInput.style.borderColor = '#e2e8f0';
            alertDiv.style.display = 'none';
        });

        // ============================================================
        // ENTER KEY PARA ENVIAR
        // ============================================================
        confirmInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                form.dispatchEvent(new Event('submit'));
            }
        });

        // ============================================================
        // INICIALIZAR
        // ============================================================
        verificarSesion();
    </script>
</body>
</html>
