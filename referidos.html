<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Mis Referidos · CUBAZON</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            color: #0f1111;
            line-height: 1.5;
            min-height: 100vh;
        }
        
        .referidos-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }
        
        .referidos-header {
            background: linear-gradient(135deg, #c62828 0%, #e53935 100%);
            color: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(198,40,40,0.3);
            position: relative;
            overflow: hidden;
        }
        
        .referidos-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }
        
        .referidos-header h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        
        .referidos-header p {
            font-size: 16px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }
        
        .referidos-icon {
            font-size: 64px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
            display: block;
        }
        
        .codigo-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 2px dashed #c62828;
        }
        
        .codigo-card h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #333;
        }
        
        .codigo-card p {
            color: #6c757d;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .codigo-display {
            display: inline-flex;
            align-items: center;
            flex-direction: column;
            gap: 10px;
            background: #f8f9fa;
            padding: 15px 30px;
            border-radius: 60px;
            margin-bottom: 15px;
        }
        
        .codigo-texto {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 8px;
            color: #c62828;
            font-family: monospace;
        }
        
        .codigo-enlace {
            font-size: 12px;
            color: #6c757d;
            letter-spacing: normal;
            font-family: monospace;
            word-break: break-all;
            max-width: 100%;
        }
        
        .btn-copiar {
            background: #c62828;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-copiar:hover {
            background: #b71c1c;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(198,40,40,0.3);
        }
        
        .btn-copiar.copiado {
            background: #28a745;
        }
        
        .ganancias-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .ganancias-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .ganancia-item {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        
        .ganancia-item h3 {
            font-size: 14px;
            color: #6c757d;
            font-weight: 500;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .ganancia-valor {
            font-size: 32px;
            font-weight: 800;
            color: #c62828;
        }
        
        .ganancia-valor.verde {
            color: #28a745;
        }
        
        .ganancia-item small {
            color: #6c757d;
            font-size: 12px;
        }
        
        .referidos-lista-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .referidos-lista-card h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }
        
        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #495057;
            border-bottom: 2px solid #dee2e6;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
            font-size: 14px;
        }
        
        tr:hover td {
            background: #f8f9fa;
        }
        
        .badge-recibio {
            background: #d4edda;
            color: #155724;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        
        .badge-pendiente {
            background: #fff3cd;
            color: #856404;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        
        .empty-state i {
            font-size: 64px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }
        
        .empty-state h3 {
            font-size: 20px;
            color: #475569;
            margin-bottom: 10px;
        }
        
        .empty-state p {
            color: #6c757d;
            margin-bottom: 25px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            text-decoration: none;
            white-space: nowrap;
        }
        
        .btn-primary {
            background: #ffd814;
            color: #0f1111;
        }
        
        .btn-primary:hover {
            background: #f7ca00;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #f0f2f5;
            color: #0f1111;
        }
        
        .btn-secondary:hover {
            background: #e3e6e9;
        }
        
        .compartir-botones {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        .btn-compartir {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            color: white;
        }
        
        .btn-compartir:hover {
            transform: translateY(-2px);
        }
        
        .btn-whatsapp {
            background: #25D366;
        }
        
        .btn-whatsapp:hover {
            background: #20bd5a;
            box-shadow: 0 4px 12px rgba(37,211,102,0.3);
        }
        
        .btn-telegram {
            background: #0088cc;
        }
        
        .btn-telegram:hover {
            background: #0077b5;
            box-shadow: 0 4px 12px rgba(0,136,204,0.3);
        }
        
        .btn-facebook {
            background: #1877f2;
        }
        
        .btn-facebook:hover {
            background: #166fe5;
            box-shadow: 0 4px 12px rgba(24,119,242,0.3);
        }
        
        .loading {
            text-align: center;
            padding: 80px 20px;
        }
        
        .loading i {
            font-size: 48px;
            color: #c62828;
            margin-bottom: 20px;
        }
        
        .toast-copiado {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #28a745;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 600;
            z-index: 9999;
            animation: slideUpFade 2s ease;
            font-size: 14px;
        }
        
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
        
        @media (max-width: 768px) {
            .referidos-container {
                padding: 0 15px;
                margin: 20px auto;
            }
            
            .referidos-header {
                padding: 30px 20px;
            }
            
            .referidos-header h1 {
                font-size: 26px;
            }
            
            .codigo-display {
                padding: 12px 20px;
            }
            
            .codigo-texto {
                font-size: 24px;
                letter-spacing: 4px;
            }
            
            .ganancias-grid {
                grid-template-columns: 1fr;
            }
            
            .compartir-botones {
                flex-direction: column;
            }
            
            .btn-compartir {
                justify-content: center;
                width: 100%;
            }
            
            .referidos-icon {
                font-size: 48px;
            }
        }
        
        @media (max-width: 480px) {
            .referidos-header h1 {
                font-size: 22px;
            }
            
            .referidos-header p {
                font-size: 14px;
            }
            
            .codigo-card {
                padding: 20px;
            }
            
            .codigo-card h2 {
                font-size: 18px;
            }
            
            .codigo-texto {
                font-size: 20px;
                letter-spacing: 4px;
            }
            
            .codigo-display {
                padding: 10px 15px;
            }
            
            .ganancia-valor {
                font-size: 24px;
            }
            
            .referidos-lista-card {
                padding: 20px;
            }
            
            th, td {
                padding: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="referidos-container">
        <div id="loadingContainer" class="loading">
            <i class="fa fa-spinner fa-pulse"></i>
            <h2>Cargando tus referidos...</h2>
        </div>
        
        <div id="referidosContent" style="display: none;"></div>
    </div>
    
    <script type="module">
        import { supabase } from '/js/supabase-client.js';
        import { auth } from '/js/auth.js';
        
        let codigoReferido = '';
        let referidos = [];
        let totalReferidos = 0;
        let montoPorReferido = 20;
        let sistemaActivo = true;
        
        async function verificarAutenticacion() {
            for (let i = 0; i < 15; i++) {
                if (auth.isAuthenticated() && auth.getUsuario()) return true;
                await new Promise(resolve => setTimeout(resolve, 200));
            }
            window.location.href = '/login.html';
            return false;
        }
        
        async function cargarConfiguracion() {
            try {
                const { data } = await supabase
                    .from('config_referidos')
                    .select('activo, monto_por_referido')
                    .single();
                
                if (data) {
                    sistemaActivo = data.activo;
                    montoPorReferido = data.monto_por_referido || 20;
                }
            } catch (error) {
                console.error('Error cargando configuración:', error);
            }
        }
        
        async function cargarDatos() {
            const usuario = auth.getUsuario();
            if (!usuario) return;
            
            try {
                // Obtener código de referido del perfil
                const { data: perfil } = await supabase
                    .from('perfiles')
                    .select('codigo_referido')
                    .eq('id', usuario.id)
                    .single();
                
                codigoReferido = perfil?.codigo_referido || 'PENDIENTE';
                
                // ✅ CORREGIDO: seleccionar 'nombre_completo' en lugar de 'nombre'
                const { data: referidosData } = await supabase
                    .from('perfiles')
                    .select('id, nombre_completo, email, telefono, created_at, codigo_referido')
                    .eq('referido_por', usuario.id)
                    .order('created_at', { ascending: false });
                
                referidos = referidosData || [];
                totalReferidos = referidos.length;
                
                // Verificar cuáles referidos ya generaron saldo
                const referidosIds = referidos.map(r => r.id);
                if (referidosIds.length > 0) {
                    const { data: historial } = await supabase
                        .from('historial_referidos')
                        .select('referido_id')
                        .eq('referidor_id', usuario.id)
                        .in('referido_id', referidosIds)
                        .eq('acreditado', true);
                    
                    const acreditadosIds = new Set(historial?.map(h => h.referido_id) || []);
                    referidos = referidos.map(r => ({
                        ...r,
                        acreditado: acreditadosIds.has(r.id)
                    }));
                }
                
            } catch (error) {
                console.error('Error cargando datos:', error);
            }
        }
        
        function renderizar() {
            const container = document.getElementById('referidosContent');
            const totalAcreditados = referidos.filter(r => r.acreditado).length;
            const gananciasTotales = totalAcreditados * montoPorReferido;
            const pendientes = totalReferidos - totalAcreditados;
            
            const urlRegistro = `${window.location.origin}/registro.html?ref=${codigoReferido}`;
            
            container.innerHTML = `
                <div class="referidos-header">
                    <span class="referidos-icon">👥</span>
                    <h1>Programa de Referidos</h1>
                    <p>Invita a tus amigos y gana <strong>$${montoPorReferido} CUP</strong> por cada uno que se registre con tu enlace</p>
                </div>
                
                <div class="codigo-card">
                    <h2>🔗 Tu enlace de referido</h2>
                    <p>Comparte este enlace con tus amigos para que se registren automáticamente con tu código</p>
                    <div class="codigo-display">
                        <span class="codigo-texto">${codigoReferido}</span>
                        <span class="codigo-enlace">${urlRegistro}</span>
                    </div>
                    <br>
                    <button class="btn-copiar" id="btnCopiar" onclick="copiarCodigo()">
                        <i class="fa fa-copy"></i> Copiar enlace
                    </button>
                    
                    <div class="compartir-botones">
                        <button class="btn-compartir btn-whatsapp" onclick="compartirWhatsApp()">
                            <i class="fa fa-whatsapp"></i> WhatsApp
                        </button>
                        <button class="btn-compartir btn-telegram" onclick="compartirTelegram()">
                            <i class="fa fa-telegram"></i> Telegram
                        </button>
                        <button class="btn-compartir btn-facebook" onclick="compartirFacebook()">
                            <i class="fa fa-facebook"></i> Facebook
                        </button>
                    </div>
                </div>
                
                <div class="ganancias-card">
                    <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 10px;">📊 Tus estadísticas</h2>
                    <div class="ganancias-grid">
                        <div class="ganancia-item">
                            <h3>Total Referidos</h3>
                            <div class="ganancia-valor">${totalReferidos}</div>
                            <small>personas invitadas</small>
                        </div>
                        <div class="ganancia-item">
                            <h3>Saldo Ganado</h3>
                            <div class="ganancia-valor verde">$${gananciasTotales.toFixed(2)}</div>
                            <small>${totalAcreditados} referidos acreditados</small>
                        </div>
                        <div class="ganancia-item">
                            <h3>Por Referido</h3>
                            <div class="ganancia-valor">$${montoPorReferido.toFixed(2)}</div>
                            <small>CUP cada uno</small>
                        </div>
                        <div class="ganancia-item">
                            <h3>Pendientes</h3>
                            <div class="ganancia-valor" style="color: ${pendientes > 0 ? '#f59e0b' : '#28a745'};">${pendientes}</div>
                            <small>por acreditar</small>
                        </div>
                    </div>
                </div>
                
                <div class="referidos-lista-card">
                    <h2><i class="fa fa-list"></i> Lista de Referidos</h2>
                    ${referidos.length === 0 ? `
                        <div class="empty-state">
                            <i class="fa fa-users"></i>
                            <h3>Aún no tienes referidos</h3>
                            <p>Comparte tu enlace y empieza a ganar saldo</p>
                            <button class="btn btn-primary" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                                <i class="fa fa-share-alt"></i> Compartir ahora
                            </button>
                        </div>
                    ` : `
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Nombre</th>
                                        <th>Email</th>
                                        <th>Teléfono</th>
                                        <th>Fecha de registro</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${referidos.map((r, index) => `
                                        <tr>
                                            <td><strong>${index + 1}</strong></td>
                                            <td><strong>${r.nombre_completo || 'Usuario'}</strong></td>
                                            <td style="font-size: 13px;">${r.email || '---'}</td>
                                            <td style="font-size: 13px;">${r.telefono || '---'}</td>
                                            <td style="font-size: 13px;">${r.created_at ? new Date(r.created_at).toLocaleDateString('es-ES') : '---'}</td>
                                            <td>
                                                ${r.acreditado ? 
                                                    '<span class="badge-recibio">💰 Saldo acreditado</span>' : 
                                                    '<span class="badge-pendiente">⏳ Pendiente</span>'
                                                }
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
                
                <div style="text-align: center; margin-top: 30px;">
                    <a href="/mi-cuenta.html" class="btn btn-secondary">
                        <i class="fa fa-arrow-left"></i> Volver a Mi Cuenta
                    </a>
                </div>
            `;
        }
        
        window.copiarCodigo = function() {
            const urlCompleta = `${window.location.origin}/registro.html?ref=${codigoReferido}`;
            navigator.clipboard.writeText(urlCompleta).then(() => {
                const btn = document.getElementById('btnCopiar');
                btn.classList.add('copiado');
                btn.innerHTML = '<i class="fa fa-check"></i> ¡Enlace copiado!';
                
                const toast = document.createElement('div');
                toast.className = 'toast-copiado';
                toast.innerHTML = '<i class="fa fa-check-circle"></i> Enlace de referido copiado al portapapeles';
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    btn.classList.remove('copiado');
                    btn.innerHTML = '<i class="fa fa-copy"></i> Copiar enlace';
                    toast.remove();
                }, 2000);
            }).catch(() => {
                Swal.fire({
                    title: 'Copia manual',
                    html: `Tu enlace de referido es:<br><br><code style="background: #f0f2f5; padding: 8px 15px; border-radius: 8px; font-size: 13px; word-break: break-all;">${urlCompleta}</code>`,
                    icon: 'info',
                    confirmButtonText: 'Entendido'
                });
            });
        };
        
        window.compartirWhatsApp = function() {
            const urlRegistro = `${window.location.origin}/registro.html?ref=${codigoReferido}`;
            const mensaje = encodeURIComponent(
                `🎁 *¡Gana $${montoPorReferido} CUP en CUBAZON!*\n\n` +
                `Regístrate con mi enlace y recibe saldo de regalo.\n\n` +
                `👉 ${urlRegistro}\n\n` +
                `¡La mejor tienda online de Cuba! 🇨🇺`
            );
            window.open(`https://wa.me/?text=${mensaje}`, '_blank');
        };
        
        window.compartirTelegram = function() {
            const urlRegistro = `${window.location.origin}/registro.html?ref=${codigoReferido}`;
            const mensaje = encodeURIComponent(
                `🎁 ¡Gana $${montoPorReferido} CUP en CUBAZON!\n\n` +
                `Regístrate con mi enlace y recibe saldo de regalo.\n\n` +
                `👉 ${urlRegistro}`
            );
            window.open(`https://t.me/share/url?url=${encodeURIComponent(urlRegistro)}&text=${mensaje}`, '_blank');
        };
        
        window.compartirFacebook = function() {
            const urlRegistro = `${window.location.origin}/registro.html?ref=${codigoReferido}`;
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(urlRegistro)}&quote=${encodeURIComponent(`¡Gana $${montoPorReferido} CUP con mi enlace en CUBAZON!`)}`, '_blank');
        };
        
        // Inicializar
        try {
            await verificarAutenticacion();
            await cargarConfiguracion();
            await cargarDatos();
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('referidosContent').style.display = 'block';
            renderizar();
        } catch (error) {
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
