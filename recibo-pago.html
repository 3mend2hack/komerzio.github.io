<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Recibo de Pago · KOMERZIO</title>
    
    <!-- Open Graph / WhatsApp -->
    <meta property="og:title" content="Recibo de Pago · KOMERZIO">
    <meta property="og:description" content="Recibo de tu pago en KOMERZIO">
    <meta property="og:image" content="https://komerzio.dpdns.org/android-chrome-512x512.png">
    <meta property="og:url" content="https://komerzio.dpdns.org/recibo-pago.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="KOMERZIO">
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Recibo de Pago · KOMERZIO">
    <meta name="twitter:description" content="Recibo de tu pago en KOMERZIO">
    <meta name="twitter:image" content="https://komerzio.dpdns.org/android-chrome-512x512.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://komerzio.dpdns.org/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="https://komerzio.dpdns.org/favicon.svg" />
    <link rel="shortcut icon" href="https://komerzio.dpdns.org/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://komerzio.dpdns.org/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="KOMERZIO" />
    <link rel="manifest" href="https://komerzio.dpdns.org/site.webmanifest" />
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f2f5;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .receipt-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .receipt-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .receipt-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.6; }
        }
        .receipt-header h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .receipt-header h1 i { color: #10b981; }
        .receipt-header p {
            position: relative;
            z-index: 1;
            opacity: 0.85;
        }
        .receipt-header .order-id {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            background: rgba(255,255,255,0.15);
            display: inline-block;
            padding: 8px 24px;
            border-radius: 30px;
            margin-top: 10px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .receipt-body {
            padding: 30px;
        }
        .receipt-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            background: #dcfce7;
            color: #166534;
        }
        .status-badge i { margin-right: 6px; }
        .receipt-meta .fecha {
            color: #64748b;
            font-size: 14px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            margin: 15px 0 20px;
            border: 1px solid #e2e8f0;
        }
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .info-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            word-break: break-word;
        }
        .info-value i { margin-right: 6px; }
        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin: 20px 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0f172a;
        }
        .section-title i { color: #f97316; }
        .products-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0 16px;
            font-size: 14px;
        }
        .products-table th, .products-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        .products-table th {
            background: #f8fafc;
            font-weight: 600;
            color: #475569;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .products-table tr:hover td {
            background: #fafbfc;
        }
        .products-table .producto-nombre {
            font-weight: 600;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        .total-row:last-child {
            border-bottom: none;
        }
        .total-row .label {
            color: #64748b;
        }
        .total-row .value {
            font-weight: 600;
            color: #0f172a;
        }
        .total-row.total {
            font-size: 18px;
            font-weight: 700;
            border-top: 2px solid #e2e8f0;
            margin-top: 12px;
            padding-top: 16px;
        }
        .total-row.total .value {
            font-size: 24px;
            color: #dc2626;
        }
        .total-row.descuento .value {
            color: #059669;
        }
        .total-row.qvapay .value {
            color: #3b82f6;
        }
        .total-row.tasa-info {
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px dashed #e2e8f0;
            margin-top: 8px;
            padding-top: 10px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            flex: 1;
            justify-content: center;
            min-width: 140px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f1111;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245,158,11,0.3);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #0f172a;
            border: 1px solid #e2e8f0;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16,185,129,0.3);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        .loading i {
            font-size: 40px;
            color: #f97316;
            margin-bottom: 15px;
            display: block;
        }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error {
            text-align: center;
            padding: 40px;
            color: #dc2626;
        }
        .error i {
            font-size: 40px;
            margin-bottom: 15px;
            display: block;
        }
        @media (max-width: 640px) {
            body { padding: 20px 12px; }
            .receipt-body { padding: 20px; }
            .receipt-header { padding: 24px 20px; }
            .receipt-header h1 { font-size: 22px; }
            .info-grid { grid-template-columns: 1fr; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
            .products-table th, .products-table td { font-size: 12px; padding: 8px 10px; }
            .receipt-meta { flex-direction: column; align-items: flex-start; }
            .total-row.total .value { font-size: 20px; }
        }
        @media (max-width: 480px) {
            .receipt-body { padding: 16px; }
            .receipt-header h1 { font-size: 20px; }
            .order-id { font-size: 12px; padding: 6px 14px; }
            .info-grid { padding: 14px; }
            .info-value { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="receipt-container">
        <div class="receipt-header">
            <h1><i class="fa fa-check-circle"></i> ¡Pago Exitoso!</h1>
            <p>Tu pago ha sido confirmado</p>
            <div class="order-id" id="orderId">Cargando...</div>
        </div>
        
        <div class="receipt-body" id="receiptBody">
            <div class="loading">
                <i class="fa fa-spinner spinner"></i>
                <p>Cargando información del recibo...</p>
            </div>
        </div>
    </div>

    <!-- ========== SCRIPTS ========== -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Configuración de Supabase -->
    <script src="/js/komerzio-config.js"></script>

    <script type="module">
        // ============================================================
        // IMPORTAR CONFIGURACIÓN DE SUPABASE
        // ============================================================
        import { supabase } from '/js/supabase-client.js';
        import { auth } from '/js/auth.js';
        
        console.log('✅ recibo-pago.html - Inicializado con Supabase');
        
        // ============================================================
        // OBTENER ID DE LA URL
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const pedidoId = urlParams.get('id');
        
        let pedidoData = null;

        // ============================================================
        // FUNCIÓN PARA OBTENER LA MONEDA
        // ============================================================
        function obtenerMoneda(metodoPago) {
            if (metodoPago === 'efectivo_cup') {
                return 'CUP';
            }
            return 'USD';
        }

        // ============================================================
        // CARGAR PEDIDO
        // ============================================================
        async function cargarPedido() {
            const receiptBody = document.getElementById('receiptBody');
            
            try {
                const usuario = auth.getUsuario();
                
                if (!usuario) {
                    receiptBody.innerHTML = `
                        <div class="error">
                            <i class="fa fa-exclamation-triangle"></i>
                            <h3>No se pudo cargar el recibo</h3>
                            <p>Inicia sesión para ver tu recibo</p>
                            <a href="/login.html" class="btn btn-primary" style="margin-top: 20px; display: inline-flex;">Iniciar sesión</a>
                        </div>
                    `;
                    return;
                }
                
                console.log('👤 Usuario autenticado:', usuario.email);
                console.log('🔍 Buscando pedido:', pedidoId);
                
                let pedido = null;
                
                if (pedidoId) {
                    const { data, error } = await supabase
                        .from('pedidos')
                        .select('*')
                        .eq('id', pedidoId)
                        .single();
                    
                    if (!error && data) {
                        pedido = data;
                        console.log('✅ Pedido encontrado por ID');
                    }
                }
                
                if (!pedido) {
                    // Buscar último pedido del usuario
                    const { data: pedidos, error } = await supabase
                        .from('pedidos')
                        .select('*')
                        .eq('user_id', usuario.id)
                        .order('created_at', { ascending: false })
                        .limit(1);
                    
                    if (error) throw error;
                    
                    if (!pedidos || pedidos.length === 0) {
                        throw new Error('No se encontró el pedido');
                    }
                    
                    pedido = pedidos[0];
                    console.log('✅ Último pedido encontrado:', pedido.id);
                }
                
                pedidoData = pedido;
                renderizarRecibo();
                
            } catch (error) {
                console.error('❌ Error cargando pedido:', error);
                receiptBody.innerHTML = `
                    <div class="error">
                        <i class="fa fa-exclamation-triangle"></i>
                        <h3>Pedido no encontrado</h3>
                        <p>${error.message || 'No pudimos encontrar la información de tu pedido.'}</p>
                        <a href="/mi-cuenta.html" class="btn btn-primary" style="margin-top: 20px; display: inline-flex;">Ver mis pedidos</a>
                    </div>
                `;
            }
        }

        // ============================================================
        // RENDERIZAR RECIBO
        // ============================================================
        function renderizarRecibo() {
            if (!pedidoData) return;
            
            const receiptBody = document.getElementById('receiptBody');
            const moneda = obtenerMoneda(pedidoData.metodo_pago);
            const simbolo = '$';
            const fecha = pedidoData.created_at 
                ? new Date(pedidoData.created_at).toLocaleString('es-ES', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                })
                : new Date().toLocaleString('es-ES');
            
            document.getElementById('orderId').textContent = `#${pedidoData.id.slice(0, 8)}`;
            
            // Productos
            const items = pedidoData.items || [];
            let productosHtml = '';
            
            if (items.length > 0) {
                productosHtml = `
                    <table class="products-table">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Cant.</th>
                                <th>Precio (${moneda})</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td class="producto-nombre">${item.nombre || 'Producto'}</td>
                                    <td>${item.cantidad || 0}</td>
                                    <td>${simbolo}${(item.precio || 0).toFixed(2)}</td>
                                    <td>${simbolo}${((item.precio || 0) * (item.cantidad || 0)).toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else {
                productosHtml = `<p style="color: #64748b; font-size: 14px;">No hay productos en este pedido</p>`;
            }
            
            // Resumen
            const cliente = pedidoData.cliente || {};
            
            let resumenHtml = `
                <div class="total-row">
                    <span class="label">Subtotal</span>
                    <span class="value">${simbolo}${(pedidoData.subtotal || 0).toFixed(2)}</span>
                </div>
                <div class="total-row">
                    <span class="label">Envío</span>
                    <span class="value">${simbolo}${(pedidoData.envio || 0).toFixed(2)}</span>
                </div>
            `;
            
            if (pedidoData.descuento > 0) {
                resumenHtml += `
                    <div class="total-row descuento">
                        <span class="label">Descuento</span>
                        <span class="value">-${simbolo}${(pedidoData.descuento || 0).toFixed(2)}</span>
                    </div>
                `;
            }
            
            resumenHtml += `
                <div class="total-row total">
                    <span class="label">Total</span>
                    <span class="value">${simbolo}${(pedidoData.total || 0).toFixed(2)} ${moneda}</span>
                </div>
            `;
            
            // Si es QvaPay
            if (pedidoData.total_qusd || pedidoData.metodo_pago === 'qvapay') {
                const qusd = pedidoData.total_qusd || (pedidoData.total / (pedidoData.tasa_aplicada || 320));
                resumenHtml += `
                    <div class="total-row qvapay">
                        <span class="label">Pagado con QvaPay</span>
                        <span class="value">${qusd.toFixed(2)} QUSD</span>
                    </div>
                `;
            }
            
            // Tasa aplicada
            if (pedidoData.tasa_aplicada) {
                resumenHtml += `
                    <div class="total-row tasa-info">
                        <span>Tasa aplicada:</span>
                        <span>1 USD = ${pedidoData.tasa_aplicada} CUP</span>
                    </div>
                `;
            }
            
            receiptBody.innerHTML = `
                <div class="receipt-meta">
                    <span class="status-badge"><i class="fa fa-check"></i> PAGADO</span>
                    <span class="fecha"><i class="fa fa-calendar"></i> ${fecha}</span>
                </div>
                
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Cliente</span>
                        <span class="info-value">${cliente.nombre || '-'}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Email</span>
                        <span class="info-value">${cliente.email || '-'}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Teléfono</span>
                        <span class="info-value">${cliente.telefono || '-'}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Método de pago</span>
                        <span class="info-value">${pedidoData.metodo_pago || 'No especificado'}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Moneda</span>
                        <span class="info-value"><strong>${moneda}</strong></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Estado</span>
                        <span class="info-value" style="color: #10b981;">✅ Confirmado</span>
                    </div>
                </div>
                
                <div class="section-title"><i class="fa fa-shopping-cart"></i> Productos</div>
                ${productosHtml}
                
                <div class="section-title"><i class="fa fa-credit-card"></i> Resumen de pago</div>
                ${resumenHtml}
                
                <div class="btn-group">
                    <button class="btn btn-success" id="downloadPdfBtn">
                        <i class="fa fa-download"></i> Descargar Recibo (PDF)
                    </button>
                    <a href="/mi-cuenta.html" class="btn btn-primary">
                        <i class="fa fa-user"></i> Mis pedidos
                    </a>
                    <a href="/" class="btn btn-secondary">
                        <i class="fa fa-home"></i> Inicio
                    </a>
                </div>
            `;
            
            // Configurar descarga de PDF
            document.getElementById('downloadPdfBtn').addEventListener('click', () => {
                const element = document.querySelector('.receipt-container');
                const opt = {
                    margin: 0.5,
                    filename: `recibo_komerzio_${pedidoData.id.slice(0, 8)}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(element).save();
            });
        }

        // ============================================================
        // INICIALIZAR
        // ============================================================
        cargarPedido();
    </script>
</body>
</html>
