<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generar VAPID</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; background: #f5f5f5; color: #111; }
    h1 { font-size: 18px; }
    button { padding: 14px; width: 100%; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-bottom: 20px; }
    .campo { margin-bottom: 20px; background: #fff; padding: 12px; border-radius: 8px; word-break: break-all; }
    .label { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .valor { font-family: monospace; font-size: 12px; color: #111; }
    .copy { padding: 8px; background: #10b981; color: #fff; border: none; border-radius: 6px; font-size: 12px; margin-top: 8px; width: 100%; }
    .aviso { background: #fef3c7; padding: 12px; border-radius: 8px; font-size: 13px; color: #92400e; }
  </style>
</head>
<body>
  <h1>🔑 Generador VAPID local</h1>
  <p class="aviso">Toca el botón. Copia las 2 claves y guárdalas antes de cerrar.</p>
  <button onclick="generar()">Generar claves VAPID</button>
  <div id="resultado"></div>

  <script>
    function b64url(bytes) {
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    async function generar() {
      const resultado = document.getElementById("resultado");
      resultado.innerHTML = "Generando...";

      try {
        // Generar par de claves ECDSA P-256
        const keyPair = await crypto.subtle.generateKey(
          { name: "ECDSA", namedCurve: "P-256" },
          true,
          ["sign", "verify"]
        );

        // Exportar pública como JWK
        const jwkPublic = await crypto.subtle.exportKey("jwk", keyPair.publicKey);
        const xBytes = Uint8Array.from(atob(jwkPublic.x.replace(/-/g, "+").replace(/_/g, "/") + "==".slice(0, (4 - jwkPublic.x.length % 4) % 4)), c => c.charCodeAt(0));
        const yBytes = Uint8Array.from(atob(jwkPublic.y.replace(/-/g, "+").replace(/_/g, "/") + "==".slice(0, (4 - jwkPublic.y.length % 4) % 4)), c => c.charCodeAt(0));
        const publicBytes = new Uint8Array(65);
        publicBytes[0] = 0x04;
        publicBytes.set(xBytes, 1);
        publicBytes.set(yBytes, 33);
        const publicKey = b64url(publicBytes);

        // Exportar privada como JWK
        const jwkPrivate = await crypto.subtle.exportKey("jwk", keyPair.privateKey);
        const dBytes = Uint8Array.from(atob(jwkPrivate.d.replace(/-/g, "+").replace(/_/g, "/") + "==".slice(0, (4 - jwkPrivate.d.length % 4) % 4)), c => c.charCodeAt(0));
        const privateKey = b64url(dBytes);

        resultado.innerHTML = `
          <div class="campo">
            <div class="label">Clave pública</div>
            <div class="valor" id="pub">${publicKey}</div>
            <button class="copy" onclick="copiar('pub')">📋 Copiar pública</button>
          </div>
          <div class="campo">
            <div class="label">Clave privada</div>
            <div class="valor" id="priv">${privateKey}</div>
            <button class="copy" onclick="copiar('priv')">📋 Copiar privada</button>
          </div>
          <div class="aviso">
            ⚠️ Guárdalas AHORA en Notas. La privada no se puede recuperar.
            No me las pases por chat.
          </div>
        `;
      } catch (e) {
        resultado.innerHTML = `<div class="aviso">Error: ${e.message}. Asegúrate de estar en HTTPS.</div>`;
      }
    }

    function copiar(id) {
      const txt = document.getElementById(id).textContent;
      navigator.clipboard.writeText(txt).then(
        () => alert("✅ Copiado"),
        () => alert("Selecciona y copia manualmente")
      );
    }
  </script>
</body>
</html>
