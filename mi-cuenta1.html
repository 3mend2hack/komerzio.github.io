            .address-actions { flex-direction: column; }
            .address-actions .btn { width: 100%; }
            .modal-header h2 { font-size: 20px; }
            .modal-body { padding: 15px; }
            .progress-steps { min-width: 350px; }
            .mis-productos-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .producto-vendedor-card { padding: 12px; }
            .producto-vendedor-image { height: 120px; }
            .btn { padding: 10px 15px; font-size: 13px; }
        }
        @media screen and (max-width: 480px) {
            .account-container { padding: 0 8px; margin: 12px auto; }
            .account-header { padding: 15px; }
            .account-title h1 { font-size: 20px; }
            .quick-actions { grid-template-columns: 1fr; }
            .quick-action-card { padding: 14px; }
            .quick-action-content p { display: block; font-size: 11px; }
            .balance-amount { font-size: 24px; }
            .balance-actions { flex-direction: column; }
            .btn-balance { width: 100%; }
            .order-card { padding: 15px; }
            .order-id { font-size: 16px; }
            .order-status { font-size: 12px; padding: 4px 10px; }
            .account-sidebar { padding: 15px; }
            .user-avatar { width: 70px; height: 70px; }
            .user-avatar i { font-size: 35px; }
            .user-name { font-size: 16px; }
            .account-menu a { padding: 10px 12px; font-size: 13px; }
            .mis-productos-grid { grid-template-columns: 1fr; }
            .modal-header { padding: 15px; }
            .modal-header h2 { font-size: 18px; }
            .close-modal { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="account-container">
        <div id="loadingContainer" class="loading" style="display: none;">
            <i class="fa fa-spinner fa-pulse"></i>
            <h2>Cargando tu cuenta...</h2>
        </div>
        
        <div id="accountContent" style="display: none;"></div>
    </div>
    
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa fa-shopping-bag"></i> Detalle del Pedido</h2>
                <span class="close-modal" onclick="window.cerrarModal()">&times;</span>
            </div>
            <div class="modal-body" id="orderModalBody"></div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Configuración de Supabase -->
    <script src="/js/komerzio-config.js"></script>

    <script type="module">
        import { supabase } from '/js/supabase-client.js';
        import { auth } from '/js/auth.js';
        import { initCarrito } from '/js/cart.js';
        
        console.log('✅ mi-cuenta.html - Inicializado con Supabase');
        
        // ============================================================
        // INICIALIZAR CARRITO
        // ============================================================
        const carrito = initCarrito();
        window.cart = carrito;
        carrito.cargarDeLocalStorage();
        carrito.actualizarInterfaz();
        
        // ============================================================
        // VARIABLES GLOBALES
        // ============================================================
        let seccionActual = 'perfil';
        let pedidos = [];
        let direcciones = [];
        let productosVendedor = [];
        let esVendedor = false;
        let estadoVerificacion = '';
        let datosTienda = null;
        let mfaActivo = false;
        let mfaFactorId = null;
        let provinciasLista = [];
        let municipiosPorProvincia = {};
        let totalReferidos = 0;

        // ============================================================
        // PROVINCIAS Y MUNICIPIOS FALLBACK
        // ============================================================
        const PROVINCIAS_FALLBACK = [
            'Pinar del Río', 'Artemisa', 'La Habana', 'Mayabeque', 'Matanzas',
            'Villa Clara', 'Sancti Spíritus', 'Ciego de Ávila', 'Camagüey', 'Las Tunas',
            'Holguín', 'Granma', 'Santiago de Cuba', 'Guantánamo', 'Isla de la Juventud'
        ];
        const MUNICIPIOS_FALLBACK = {
            'Pinar del Río': ['Pinar del Río', 'San Juan y Martínez', 'Viñales'],
            'La Habana': ['Cerro', 'Centro Habana', 'La Habana Vieja', 'Diez de Octubre'],
            'Holguín': ['Holguín', 'Antilla', 'Báguanos', 'Banes', 'Sagua de Tánamo']
        };

        // ============================================================
        // CARGAR PROVINCIAS Y MUNICIPIOS
        // ============================================================
        async function cargarProvinciasYMunicipios() {
            try {
                const { data: provincias, error: errProv } = await supabase
                    .from('provincias_cuba')
                    .select('id, nombre')
                    .order('nombre');
                
                if (!errProv && provincias && provincias.length > 0) {
                    provinciasLista = provincias;
                    const { data: municipios, error: errMun } = await supabase
                        .from('municipios_cuba')
                        .select('id, nombre, provincia_id');
                    if (!errMun && municipios) {
                        municipiosPorProvincia = {};
                        municipios.forEach(m => {
                            if (!municipiosPorProvincia[m.provincia_id]) {
                                municipiosPorProvincia[m.provincia_id] = [];
                            }
                            municipiosPorProvincia[m.provincia_id].push(m);
                        });
                        console.log('✅ Provincias/municipios cargados desde Supabase');
                        return;
                    }
                }
                // Fallback
                provinciasLista = PROVINCIAS_FALLBACK.map(p => ({ id: p, nombre: p }));
                municipiosPorProvincia = {};
                PROVINCIAS_FALLBACK.forEach(p => {
                    municipiosPorProvincia[p] = (MUNICIPIOS_FALLBACK[p] || []).map(m => ({ id: m, nombre: m }));
                });
                console.log('⚠️ Usando provincias/municipios fallback');
            } catch (error) {
                provinciasLista = PROVINCIAS_FALLBACK.map(p => ({ id: p, nombre: p }));
            }
        }
        
        function obtenerOptionsProvincias(selectedValue = '') {
            let html = '<option value="">Selecciona tu provincia</option>';
            provinciasLista.forEach(p => {
                const selected = (selectedValue === p.nombre) ? 'selected' : '';
                html += `<option value="${p.nombre}" ${selected}>${p.nombre}</option>`;
            });
            return html;
        }
        
        function obtenerOptionsMunicipios(provinciaNombre, selectedValue = '') {
            const municipios = municipiosPorProvincia[provinciaNombre] || [];
            if (municipios.length === 0) return '<option value="">Primero selecciona una provincia</option>';
            let html = '<option value="">Selecciona tu municipio</option>';
            municipios.forEach(m => {
                const selected = (selectedValue === m.nombre) ? 'selected' : '';
                html += `<option value="${m.nombre}" ${selected}>${m.nombre}</option>`;
            });
            return html;
        }

        // ============================================================
        // VERIFICAR SI ESTÁ AUTENTICADO
        // ============================================================
        async function iniciar() {
            for (let i = 0; i < 25; i++) {
                if (auth.isAuthenticated()) break;
                await new Promise(resolve => setTimeout(resolve, 200));
            }
            
            if (!auth.isAuthenticated()) {
                window.location.href = '/login.html?redirect=/mi-cuenta.html';
                return;
            }
            
            await cargarProvinciasYMunicipios();
            await cargarDatos();
        }
        
        // ============================================================
        // CARGAR DATOS PRINCIPALES
        // ============================================================
        async function cargarDatos() {
            document.getElementById('loadingContainer').style.display = 'block';
            document.getElementById('accountContent').style.display = 'none';
            
            const usuarioAuth = auth.getUsuario();
            if (!usuarioAuth) {
                window.location.href = '/login.html';
                return;
            }
            
            // Cargar perfil
            let usuarioCompleto = { ...usuarioAuth };
            try {
                const { data: perfil, error } = await supabase
                    .from('perfiles')
                    .select('*')
                    .eq('id', usuarioAuth.id)
                    .single();
                if (!error && perfil) {
                    usuarioCompleto = { ...usuarioAuth, ...perfil };
                }
            } catch (error) {}
            
            // Cargar pedidos
            try {
                const { data: pedidosData } = await supabase
                    .from('pedidos')
                    .select('*')
                    .eq('user_id', usuarioAuth.id)
                    .order('created_at', { ascending: false });
                pedidos = pedidosData || [];
            } catch (e) { pedidos = []; }
            
            // Cargar direcciones
            try {
                const { data: direccionesData } = await supabase
                    .from('direcciones')
                    .select('*')
                    .eq('usuario_id', usuarioAuth.id);
                direcciones = direccionesData || [];
            } catch (e) { direcciones = []; }
            
            // Verificar vendedor
            await verificarVendedor();
            await cargarProductosVendedor();
            await verificarEstado2FA();
            await cargarTotalReferidos();
            
            await renderizarCuenta(usuarioCompleto);
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('accountContent').style.display = 'block';
        }
        
        // ============================================================
        // FUNCIONES AUXILIARES
        // ============================================================
        async function verificarVendedor() {
            const usuario = auth.getUsuario();
            if (!usuario) return false;
            try {
                const { data, error } = await supabase
                    .from('vendedores')
                    .select('id, estado_verificacion, nombre_tienda, logo_url, baneado, motivo_baneo')
                    .eq('id', usuario.id)
                    .single();
                if (error) throw error;
                esVendedor = !!data;
                if (data) { estadoVerificacion = data.estado_verificacion; datosTienda = data; }
                return esVendedor;
            } catch (error) {
                esVendedor = false;
                return false;
            }
        }
        
        async function cargarProductosVendedor() {
            const usuario = auth.getUsuario();
            if (!usuario || !esVendedor) return;
            try {
                const { data, error } = await supabase
                    .from('productos_vendedor')
                    .select('*')
                    .eq('vendedor_id', usuario.id)
                    .order('created_at', { ascending: false });
                if (!error) productosVendedor = data || [];
            } catch (error) { productosVendedor = []; }
        }
        
        async function verificarEstado2FA() {
            try {
                const { data: factors, error } = await supabase.auth.mfa.listFactors();
                if (error) throw error;
                const totpFactor = factors.totp.find(f => f.status === 'verified');
                mfaActivo = !!totpFactor;
                if (mfaActivo && totpFactor) mfaFactorId = totpFactor.id;
                return mfaActivo;
            } catch (error) { return false; }
        }
        
        async function cargarTotalReferidos() {
            const usuario = auth.getUsuario();
            if (!usuario) return;
            try {
                const { count, error } = await supabase
                    .from('perfiles')
                    .select('*', { count: 'exact', head: true })
                    .eq('referido_por', usuario.id);
                if (!error) totalReferidos = count || 0;
            } catch (e) { totalReferidos = 0; }
        }
        
        async function cargarSaldoActual() {
            const usuario = auth.getUsuario();
            if (!usuario) return 0;
            try {
                const { data, error } = await supabase
                    .from('saldo_usuarios')
                    .select('saldo_actual')
                    .eq('user_id', usuario.id)
                    .maybeSingle();
                if (error && error.code !== 'PGRST116') throw error;
                return data?.saldo_actual || 0;
            } catch (error) { return 0; }
        }

        // ============================================================
        // RENDERIZAR CUENTA
        // ============================================================
        async function renderizarCuenta(usuario) {
            const container = document.getElementById('accountContent');
            const saldo = await cargarSaldoActual();
            
            let estadoTiendaClass = '';
            let estadoTiendaTexto = '';
            if (datosTienda) {
                if (datosTienda.baneado) {
                    estadoTiendaClass = 'estado-baneado';
                    estadoTiendaTexto = '🚫 Suspendida';
                } else {
                    switch (datosTienda.estado_verificacion) {
                        case 'verificado': estadoTiendaClass = 'estado-verificado'; estadoTiendaTexto = '✅ Verificada'; break;
                        case 'pendiente': estadoTiendaClass = 'estado-pendiente'; estadoTiendaTexto = '⏳ Pendiente'; break;
                        case 'rechazado': estadoTiendaClass = 'estado-rechazado'; estadoTiendaTexto = '❌ Rechazada'; break;
                        default: estadoTiendaClass = 'estado-pendiente'; estadoTiendaTexto = '⏳ Pendiente';
                    }
                }
            }
            
            container.innerHTML = `
                <div class="account-header">
                    <div class="account-title"><i class="fa fa-user-circle"></i><h1>Mi cuenta</h1></div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <a href="/index.html" class="btn btn-secondary"><i class="fa fa-home"></i> Inicio</a>
                        <button class="btn btn-secondary" onclick="window.cerrarSesion()"><i class="fa fa-sign-out"></i> Cerrar sesión</button>
                    </div>
                </div>
                <div class="quick-actions">
                    ${esVendedor ? `
                        <a href="/configurar-tienda.html" class="quick-action-card"><div class="quick-action-icon store"><i class="fa fa-store"></i></div><div class="quick-action-content"><h3>Mi tienda</h3><p>Editar configuración</p></div></a>
                        <a href="/publicar-producto.html" class="quick-action-card"><div class="quick-action-icon publish"><i class="fa fa-cloud-upload"></i></div><div class="quick-action-content"><h3>Publicar producto</h3><p>Agrega un producto</p></div></a>
                    ` : ``}
                    <a href="/referidos.html" class="quick-action-card"><div class="quick-action-icon referidos"><i class="fa fa-users"></i></div><div class="quick-action-content"><h3>Referidos ${totalReferidos > 0 ? `(${totalReferidos})` : ''}</h3><p>Invita y gana saldo</p></div></a>
                    <a href="/transferir.html" class="quick-action-card"><div class="quick-action-icon transfer"><i class="fa fa-exchange"></i></div><div class="quick-action-content"><h3>Transferir saldo</h3><p>Envía dinero</p></div></a>
                    <a href="/recibir.html" class="quick-action-card"><div class="quick-action-icon receive"><i class="fa fa-qrcode"></i></div><div class="quick-action-content"><h3>Recibir dinero</h3><p>Genera QR para pagos</p></div></a>
                    <a href="/pagar-qr.html" class="quick-action-card"><div class="quick-action-icon pay"><i class="fa fa-camera"></i></div><div class="quick-action-content"><h3>Pagar con QR</h3><p>Escanea y paga</p></div></a>
                    <a href="/recarga.html" class="quick-action-card"><div class="quick-action-icon usdt"><i class="fa fa-bolt"></i></div><div class="quick-action-content"><h3>Recargar con USDT</h3><p>Criptomonedas</p></div></a>
                </div>
                <div class="balance-card">
                    <div class="balance-icon"><i class="fa fa-credit-card"></i></div>
                    <div class="balance-info"><h3>Tu saldo KOMERZIO</h3><div class="balance-amount">$${saldo.toFixed(2)} <small>USD</small></div></div>
                    <div class="balance-actions">
                        <button class="btn-balance" onclick="window.recargarSaldo()"><i class="fa fa-plus-circle"></i> Recargar</button>
                        <button class="btn-balance" onclick="window.historialSaldo()"><i class="fa fa-history"></i> Historial</button>
                    </div>
                </div>
                <div class="account-grid">
                    <div class="account-sidebar">
                        <div class="user-info">
                            <div class="user-avatar"><i class="fa fa-user"></i></div>
                            <div class="user-name">${(usuario.nombre_completo || usuario.email?.split('@')[0] || 'Usuario').replace(/"/g, '&quot;')}</div>
                            <div class="user-email">${usuario.email}</div>
                        </div>
                        ${esVendedor && datosTienda ? `
                        <div class="tienda-info-card">
                            <div class="tienda-logo-container">
                                <img id="tienda-logo-img" class="tienda-logo" src="${datosTienda.logo_url || 'https://via.placeholder.com/100x100?text=TIENDA'}" alt="${datosTienda.nombre_tienda || 'Mi Tienda'}">
                                <div class="btn-cambiar-logo" onclick="window.cambiarLogo()" title="Cambiar logo"><i class="fa fa-camera"></i></div>
                            </div>
                            <div class="tienda-nombre">${datosTienda.nombre_tienda || 'Mi Tienda'}</div>
                            <span class="tienda-estado ${estadoTiendaClass}">${estadoTiendaTexto}</span>
                        </div>
                        ` : ''}
                        <ul class="account-menu">
                            <li><a href="#" class="active" data-seccion="perfil"><i class="fa fa-user"></i> Mi perfil</a></li>
                            ${esVendedor ? `
                                <li><a href="#" data-seccion="mis-productos"><i class="fa fa-cube"></i> Mis productos ${productosVendedor.length > 0 ? `<span class="menu-badge">${productosVendedor.length}</span>` : ''}</a></li>
                            ` : ''}
                            <li><a href="#" data-seccion="pedidos"><i class="fa fa-shopping-bag"></i> Mis pedidos ${pedidos.length > 0 ? `<span class="menu-badge">${pedidos.length}</span>` : ''}</a></li>
                            <li><a href="/referidos.html" data-external="true"><i class="fa fa-users"></i> Referidos ${totalReferidos > 0 ? `<span class="menu-badge referidos">${totalReferidos}</span>` : ''}</a></li>
                            <li><a href="#" data-seccion="recargas"><i class="fa fa-history"></i> Historial recargas</a></li>
                            <li><a href="#" data-seccion="direcciones"><i class="fa fa-map-marker"></i> Mis direcciones ${direcciones.length > 0 ? `<span class="menu-badge">${direcciones.length}</span>` : ''}</a></li>
                            <li><a href="#" data-seccion="seguridad"><i class="fa fa-lock"></i> Seguridad</a></li>
                        </ul>
                    </div>
                    <div class="account-content" id="accountContentArea">${await renderizarPerfil(usuario)}</div>
                </div>
            `;
            
            document.querySelectorAll('.account-menu a').forEach(link => {
                link.addEventListener('click', function(e) {
                    if (this.dataset.external === 'true') return;
                    e.preventDefault();
                    document.querySelectorAll('.account-menu a').forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                    const seccion = this.dataset.seccion;
                    seccionActual = seccion;
                    const contentArea = document.getElementById('accountContentArea');
                    switch(seccion) {
                        case 'perfil': renderizarPerfil(usuario).then(html => contentArea.innerHTML = html); break;
                        case 'mis-productos': contentArea.innerHTML = renderizarMisProductos(); break;
                        case 'pedidos': contentArea.innerHTML = renderizarPedidos(); break;
                        case 'recargas': contentArea.innerHTML = renderizarHistorialRecargas(); break;
                        case 'direcciones': contentArea.innerHTML = renderizarDirecciones(); break;
                        case 'seguridad': contentArea.innerHTML = renderizarSeguridad(); break;
                    }
                });
            });
        }

        // ============================================================
        // FUNCIONES DE RENDERIZADO POR SECCIÓN
        // ============================================================
        async function renderizarPerfil(usuario) {
            return `
                <div class="section-title"><span><i class="fa fa-user"></i> Mi perfil</span><button class="btn btn-secondary" onclick="window.editarPerfil()"><i class="fa fa-edit"></i> Editar</button></div>
                <div class="profile-form">
                    <div class="form-row"><div class="form-group"><label>Nombre completo</label><input type="text" class="form-control" value="${(usuario.nombre_completo || '').replace(/"/g, '&quot;')}" readonly disabled></div><div class="form-group"><label>Email</label><input type="email" class="form-control" value="${usuario.email}" readonly disabled></div></div>
                    <div class="form-row"><div class="form-group"><label>Teléfono</label><input type="tel" class="form-control" value="${usuario.telefono || ''}" readonly disabled></div><div class="form-group"><label>Carnet/Pasaporte</label><input type="text" class="form-control" value="${usuario.carnet || ''}" readonly disabled></div></div>
                    <div class="form-group"><label>Dirección</label><input type="text" class="form-control" value="${usuario.direccion || ''}" readonly disabled></div>
                    <div class="form-row"><div class="form-group"><label>Localidad/Barrio</label><input type="text" class="form-control" value="${usuario.localidad || ''}" readonly disabled></div><div class="form-group"><label>Provincia</label><input type="text" class="form-control" value="${usuario.provincia || ''}" readonly disabled></div></div>
                    <div class="form-row"><div class="form-group"><label>Municipio</label><input type="text" class="form-control" value="${usuario.municipio || ''}" readonly disabled></div><div class="form-group"><label>Referencia</label><input type="text" class="form-control" value="${usuario.referencia || ''}" readonly disabled></div></div>
                    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee;"><small style="color: #6c757d;"><i class="fa fa-info-circle"></i> Miembro desde ${usuario.created_at ? new Date(usuario.created_at).toLocaleDateString('es-ES', { year: 'numeric', month: 'long' }) : 'recientemente'}</small></div>
                </div>
            `;
        }
        
        function renderizarMisProductos() {
            if (productosVendedor.length === 0) {
                return `<div class="section-title"><span><i class="fa fa-cube"></i> Mis productos</span><a href="/publicar-producto.html" class="btn btn-primary"><i class="fa fa-plus"></i> Publicar producto</a></div><div style="text-align: center; padding: 60px 20px;"><i class="fa fa-store" style="font-size: 64px; color: #ddd; margin-bottom: 20px;"></i><h3>Aún no tienes productos</h3><p>Publica tu primer producto y comienza a vender.</p><a href="/publicar-producto.html" class="btn btn-primary">Publicar producto</a></div>`;
            }
            let html = `<div class="section-title"><span><i class="fa fa-cube"></i> Mis productos (${productosVendedor.length})</span><a href="/publicar-producto.html" class="btn btn-primary"><i class="fa fa-plus"></i> Nuevo producto</a></div><div class="mis-productos-grid">`;
            productosVendedor.forEach(p => {
                const estado = p.activo ? 'Activo' : 'Inactivo';
                const estadoColor = p.activo ? '#28a745' : '#dc3545';
                html += `<div class="producto-vendedor-card"><img src="${p.imagen_url || '/assets/images/no-image.jpg'}" class="producto-vendedor-image" onerror="this.src='/assets/images/no-image.jpg'"><div class="producto-vendedor-info"><h4>${p.nombre.replace(/"/g, '&quot;')}</h4><div class="producto-vendedor-precio">$${p.precio.toFixed(2)} USD</div><div style="display: flex; justify-content: space-between; margin-bottom: 10px;"><span style="font-size: 12px;">Stock: ${p.stock}</span><span style="font-size: 12px; color: ${estadoColor};">${estado}</span></div><div class="producto-vendedor-acciones"><button class="btn btn-secondary" onclick="window.editarProductoVendedor(${p.id})"><i class="fa fa-edit"></i></button><button class="btn btn-secondary" onclick="window.toggleEstadoProducto(${p.id}, ${!p.activo})"><i class="fa ${p.activo ? 'fa-eye-slash' : 'fa-eye'}"></i></button><button class="btn btn-danger" onclick="window.eliminarProductoVendedor(${p.id})"><i class="fa fa-trash"></i></button></div></div></div>`;
            });
            html += `</div>`;
            return html;
        }
        
        function renderizarPedidos() {
            if (pedidos.length === 0) {
                return `<div class="section-title"><span><i class="fa fa-shopping-bag"></i> Mis pedidos</span></div><div style="text-align: center; padding: 60px 20px;"><i class="fa fa-truck" style="font-size: 64px; color: #ddd; margin-bottom: 20px;"></i><h3>No tienes pedidos aún</h3><p>Explora nuestra tienda y encuentra lo que buscas</p><a href="/" class="btn btn-primary">Ir a comprar</a></div>`;
            }
            // ... resto de renderizado de pedidos
            return `<div class="section-title"><span><i class="fa fa-shopping-bag"></i> Mis pedidos</span><span style="font-size: 14px; font-weight: normal; color: #6c757d;">${pedidos.length} pedidos</span></div><div class="orders-list">${pedidos.map(p => `<div class="order-card">Pedido #${p.id.slice(0,8)}</div>`).join('')}</div>`;
        }
        
        async function renderizarHistorialRecargas() {
            // Función simplificada
            return `<div class="section-title"><span><i class="fa fa-history"></i> Historial de recargas USDT</span></div><div style="text-align: center; padding: 40px;"><i class="fa fa-history" style="font-size: 48px; color: #ddd;"></i><p style="margin-top: 15px; color: #6c757d;">Próximamente podrás ver tu historial de recargas</p></div>`;
        }
        
        function renderizarDirecciones() {
            let html = `<div class="section-title"><span><i class="fa fa-map-marker"></i> Mis direcciones</span><button class="btn btn-primary" onclick="window.agregarDireccion()"><i class="fa fa-plus"></i> Nueva dirección</button></div>`;
            if (direcciones.length === 0) {
                html += `<div style="text-align: center; padding: 60px 20px;"><i class="fa fa-map-marker" style="font-size: 64px; color: #ddd; margin-bottom: 20px;"></i><h3>No tienes direcciones guardadas</h3><button class="btn btn-primary" onclick="window.agregarDireccion()">Agregar dirección</button></div>`;
            } else {
                html += `<div style="display: grid; gap: 20px;">`;
                direcciones.forEach(d => {
                    html += `<div class="address-card">${d.es_principal ? '<span class="address-badge">Principal</span>' : ''}<div class="address-name">${d.nombre}</div><div class="address-details">${d.direccion}<br>${d.localidad}${d.referencia ? ` - ${d.referencia}` : ''}<br>Tel: ${d.telefono}</div><div class="address-actions"><button class="btn btn-secondary" onclick="window.editarDireccion(${d.id})"><i class="fa fa-edit"></i> Editar</button><button class="btn btn-secondary" onclick="window.eliminarDireccion(${d.id})"><i class="fa fa-trash"></i> Eliminar</button>${!d.es_principal ? `<button class="btn btn-secondary" onclick="window.hacerPrincipal(${d.id})"><i class="fa fa-check-circle"></i> Hacer principal</button>` : ''}</div></div>`;
                });
                html += `</div>`;
            }
            return html;
        }
        
        function renderizarSeguridad() {
            const usuario = auth.getUsuario();
            const esUsuarioGoogle = usuario?.email?.includes('gmail.com') || false;
            
            return `
                <div class="section-title"><span><i class="fa fa-lock"></i> Seguridad</span></div>
                <div style="max-width: 500px;">
                    <div class="mfa-card">
                        <div class="mfa-header">
                            <div class="mfa-title"><i class="fa fa-google"></i> Google Authenticator (2FA)</div>
                            ${mfaActivo ? '<span class="mfa-badge-active"><i class="fa fa-check-circle"></i> 2FA activado</span>' : '<span class="mfa-badge-inactive"><i class="fa fa-shield-alt"></i> 2FA inactivo</span>'}
                        </div>
                        <div class="mfa-description">
                            ${mfaActivo ? 'Tu cuenta está protegida con autenticación de dos factores.' : 'Añade una capa extra de seguridad a tu cuenta con Google Authenticator.'}
                        </div>
                        <div class="mfa-actions">
                            ${!mfaActivo ? '<button class="btn btn-primary" onclick="window.activar2FA()"><i class="fa fa-shield-alt"></i> Activar 2FA</button>' : `
                                <button class="btn btn-secondary" onclick="window.verCodigosRespaldo2FA()"><i class="fa fa-key"></i> Ver códigos de respaldo</button>
                                <button class="btn btn-secondary" onclick="window.regenerarCodigosRespaldo2FA()"><i class="fa fa-refresh"></i> Regenerar códigos</button>
                                <button class="btn btn-danger" onclick="window.desactivar2FA()"><i class="fa fa-trash"></i> Desactivar 2FA</button>
                            `}
                        </div>
                    </div>
                    ${!esUsuarioGoogle ? `
                    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">
                        <h3 style="font-size: 18px; margin-bottom: 20px;">Cambiar contraseña</h3>
                        <div class="form-group"><label>Contraseña actual</label><input type="password" id="currentPassword" class="form-control" placeholder="••••••••"></div>
                        <div class="form-group"><label>Nueva contraseña</label><input type="password" id="newPassword" class="form-control" placeholder="Mínimo 8 caracteres"></div>
                        <div class="form-group"><label>Confirmar nueva contraseña</label><input type="password" id="confirmNewPassword" class="form-control" placeholder="••••••••"></div>
                        <button class="btn btn-primary" onclick="window.cambiarPassword()"><i class="fa fa-save"></i> Actualizar contraseña</button>
                    </div>
                    ` : `
                    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">
                        <div style="background: #e3f2fd; padding: 15px; border-radius: 8px;">
                            <i class="fa fa-google"></i> <strong>Cuenta de Google</strong>
                            <p style="margin-top: 10px; font-size: 14px;">Tu cuenta está vinculada con Google. La contraseña se gestiona desde tu cuenta de Google.</p>
                        </div>
                    </div>
                    `}
                    <div style="margin-top: 40px; padding-top: 30px; border-top: 1px solid #eee;">
                        <h3 style="font-size: 18px; margin-bottom: 15px; color: #dc3545;">Zona peligrosa</h3>
                        ${!esUsuarioGoogle ? '<button class="btn btn-danger" onclick="window.eliminarCuenta()"><i class="fa fa-trash"></i> Eliminar mi cuenta</button>' : '<button class="btn btn-danger" onclick="window.eliminarCuentaGoogle()"><i class="fa fa-trash"></i> Eliminar mi cuenta</button>'}
                        <p style="color: #6c757d; font-size: 13px; margin-top: 10px;">Esta acción eliminará permanentemente tu cuenta y todos tus datos.</p>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // FUNCIONES GLOBALES WINDOW
        // ============================================================
        
        // Cerrar sesión
        window.cerrarSesion = async function() {
            const result = await Swal.fire({
                title: '¿Cerrar sesión?',
                text: '¿Estás seguro que deseas cerrar tu sesión?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Sí, cerrar sesión',
                cancelButtonText: 'Cancelar'
            });
            if (result.isConfirmed) {
                await auth.cerrarSesion();
                window.location.href = '/';
            }
        };
        
        // Recargar saldo
        window.recargarSaldo = async function() {
            window.location.href = '/recarga.html';
        };
        
        // Historial de saldo
        window.historialSaldo = async function() {
            const usuario = auth.getUsuario();
            if (!usuario) return;
            try {
                const { data: historial, error } = await supabase
                    .from('historial_saldo')
                    .select('*')
                    .eq('user_id', usuario.id)
                    .order('created_at', { ascending: false })
                    .limit(20);
                if (error) throw error;
                if (!historial || historial.length === 0) {
                    Swal.fire({ icon: 'info', title: 'Sin movimientos', text: 'Aún no tienes movimientos de saldo' });
                    return;
                }
                // Mostrar historial en SweetAlert
                let html = '<div class="table-responsive"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Monto</th><th>Saldo</th><th>Descripción</th></tr></thead><tbody>';
                historial.forEach(h => {
                    const fecha = new Date(h.created_at).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    const signo = h.monto > 0 ? '+' : '-';
                    const color = h.monto > 0 ? '#28a745' : '#dc3545';
                    html += `<tr><td>${fecha}</td><td>${h.tipo || 'Movimiento'}</td><td style="color:${color};font-weight:700;">${signo}$${Math.abs(h.monto).toFixed(2)}</td><td>$${h.saldo_nuevo?.toFixed(2) || '0.00'}</td><td>${h.descripcion || '-'}</td></tr>`;
                });
                html += '</tbody></table></div>';
                Swal.fire({ title: 'Historial de saldo', html, width: '900px' });
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Error', text: 'No se pudo cargar el historial' });
            }
        };
        
        // Editar perfil
        window.editarPerfil = async function() {
            const usuario = auth.getUsuario();
            const { data: perfil } = await supabase
                .from('perfiles')
                .select('*')
                .eq('id', usuario.id)
                .single();
            
            const provinciaActual = perfil?.provincia || '';
            const municipioActual = perfil?.municipio || '';
            
            const { value: formValues } = await Swal.fire({
                title: 'Editar perfil',
                html: `
                    <input type="text" id="nombre" class="swal2-input" placeholder="Nombre completo" value="${(perfil?.nombre || usuario.nombre_completo || '').replace(/"/g, '&quot;')}">
                    <input type="tel" id="telefono" class="swal2-input" placeholder="Teléfono" value="${perfil?.telefono || usuario.telefono || ''}">
                    <input type="text" id="carnet" class="swal2-input" placeholder="Carnet/Pasaporte" value="${perfil?.carnet || ''}">
                    <input type="text" id="direccion" class="swal2-input" placeholder="Dirección" value="${perfil?.direccion || ''}">
                    <input type="text" id="localidad" class="swal2-input" placeholder="Localidad/Barrio" value="${perfil?.localidad || ''}">
                    <select id="provinciaSelect" class="swal2-select" style="width:100%; padding:10px; margin-bottom:15px;">${obtenerOptionsProvincias(provinciaActual)}</select>
                    <select id="municipioSelect" class="swal2-select" style="width:100%; padding:10px;">${obtenerOptionsMunicipios(provinciaActual, municipioActual)}</select>
                    <input type="text" id="referencia" class="swal2-input" placeholder="Referencia (opcional)" value="${perfil?.referencia || ''}">
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Guardar',
                cancelButtonText: 'Cancelar',
                preConfirm: () => {
                    const provincia = document.getElementById('provinciaSelect').value;
                    const municipio = document.getElementById('municipioSelect').value;
                    if (provincia && !municipio) {
                        Swal.showValidationMessage('Si seleccionas provincia, debes seleccionar también el municipio');
                        return false;
                    }
                    return {
                        nombre: document.getElementById('nombre').value,
                        telefono: document.getElementById('telefono').value,
                        carnet: document.getElementById('carnet').value,
                        direccion: document.getElementById('direccion').value,
                        localidad: document.getElementById('localidad').value,
                        provincia: provincia,
                        municipio: municipio,
                        referencia: document.getElementById('referencia').value
                    };
                }
            });
            if (formValues) {
                const resultado = await auth.actualizarPerfil(formValues);
                if (resultado.success) {
                    Swal.fire('¡Actualizado!', 'Tu perfil ha sido actualizado', 'success');
                    await cargarDatos();
                } else {
                    Swal.fire('Error', resultado.error, 'error');
                }
            }
        };
        
        // Gestión de direcciones
        window.agregarDireccion = async function() {
            const { value: formValues } = await Swal.fire({
                title: 'Nueva dirección',
                html: `
                    <input type="text" id="nombre" class="swal2-input" placeholder="Nombre de la dirección (Ej: Casa, Trabajo)" required>
                    <input type="text" id="direccion" class="swal2-input" placeholder="Dirección completa" required>
                    <input type="text" id="localidad" class="swal2-input" placeholder="Localidad/Barrio" required>
                    <input type="text" id="referencia" class="swal2-input" placeholder="Referencia">
                    <input type="tel" id="telefono" class="swal2-input" placeholder="Teléfono" required>
                    <label style="display: flex; align-items: center; gap: 10px; margin-top: 15px;">
                        <input type="checkbox" id="esPrincipal"> <span>Establecer como dirección principal</span>
                    </label>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Guardar',
                cancelButtonText: 'Cancelar',
                preConfirm: () => {
                    const nombre = document.getElementById('nombre').value;
                    const direc = document.getElementById('direccion').value;
                    const localidad = document.getElementById('localidad').value;
                    const telefono = document.getElementById('telefono').value;
                    if (!nombre || !direc || !localidad || !telefono) {
                        Swal.showValidationMessage('Todos los campos obligatorios deben estar llenos');
                        return false;
                    }
                    return {
                        nombre,
                        direccion: direc,
                        localidad,
                        referencia: document.getElementById('referencia').value,
                        telefono,
                        es_principal: document.getElementById('esPrincipal').checked
                    };
                }
            });
            if (formValues) {
                try {
                    if (formValues.es_principal) {
                        await supabase
                            .from('direcciones')
                            .update({ es_principal: false })
                            .eq('usuario_id', auth.getUsuario().id);
                    }
                    const { error } = await supabase
                        .from('direcciones')
                        .insert([{ usuario_id: auth.getUsuario().id, ...formValues }]);
                    if (error) throw error;
                    Swal.fire('¡Agregada!', 'Dirección guardada correctamente', 'success');
                    await cargarDatos();
                } catch (error) {
                    Swal.fire('Error', 'No se pudo guardar la dirección', 'error');
                }
            }
        };
        
        // Cambiar contraseña
        window.cambiarPassword = async function() {
            const current = document.getElementById('currentPassword')?.value;
            const newPass = document.getElementById('newPassword')?.value;
            const confirmPass = document.getElementById('confirmNewPassword')?.value;
            
            if (!current || !newPass || !confirmPass) {
                Swal.fire('Error', 'Completa todos los campos', 'error');
                return;
            }
            if (newPass !== confirmPass) {
                Swal.fire('Error', 'Las contraseñas no coinciden', 'error');
                return;
            }
            if (newPass.length < 8) {
                Swal.fire('Error', 'La contraseña debe tener al menos 8 caracteres', 'error');
                return;
            }
            
            const resultado = await auth.cambiarPassword(current, newPass);
            if (resultado.success) {
                Swal.fire('¡Actualizada!', 'Tu contraseña ha sido cambiada', 'success');
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmNewPassword').value = '';
            } else {
                Swal.fire('Error', resultado.error, 'error');
            }
        };

        // ============================================================
        // INICIAR
        // ============================================================
        iniciar();
    </script>
</body>
</html>
