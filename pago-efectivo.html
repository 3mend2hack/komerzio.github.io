<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .confirm-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .confirm-header {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .confirm-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.6; }
        }
        
        .confirm-header h1 {
            font-size: 28px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        
        .order-id {
            background: rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            margin-top: 15px;
            display: inline-block;
            font-family: 'Courier New', monospace;
            position: relative;
            z-index: 1;
        }
        
        .confirm-body {
            padding: 30px;
        }
        
        .status-card {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 18px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .status-card i {
            font-size: 28px;
            color: #f59e0b;

        }
        
        .status-card h3 {
            color: #92400e;
            margin-bottom: 3px;

        }
        
        .status-card p {

        .warning-card {
            background: #fee2e2;
            border-left: 4px solid #dc2626;
            padding: 18px 20px;
            border-radius: 12px;
            margin-bottom: 20px;

        .warning-card i {

        }
        
        .warning-card h3 {

        .warning-card p {

        .info-card {

        .info-card h3 {

        .info-card h3 i { color: #f97316; margin-right: 8px; }

        .total-row .info-label {

        }
        
        .total-row .info-value {

        }
        
        .products-list {

            overflow-y: auto;
        }
        
        .products-list::-webkit-scrollbar { width: 4px; }
        .products-list::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        .product-item {
            display: flex;
            gap: 12px;

        }
        
        .product-item:last-child { border-bottom: none; }
        
        .product-item img {
            width: 50px;

        }
        
        .product-details {

        .whatsapp-card {
            background: #dcfce7;

        .btn-whatsapp {

            border: none;

            border-radius: 40px;

            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;

        .btn-whatsapp:hover {

        }
        
        .btn-confirm {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 15px rgba(249,115,22,0.3);
        }
        
        .btn-confirm:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(249,115,22,0.4);
        }
        
        .btn-confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .timer {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 15px;

            margin: 20px 0;

        .timer strong {

        }
        
        .timer span {

            display: block;
            margin-top: 5px;
            font-family: 'Courier New', monospace;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }
        
        .loading i {
            font-size: 48px;
            color: #f97316;
            margin-bottom: 15px;
            display: block;
        }
        
        .spinner {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            text-align: center;
            padding: 60px 20px;
            color: #dc2626;
        }
        
        .error i {
            font-size: 48px;

            display: block;
        }
        
        .btn-home {
            display: inline-block;
            margin-top: 20px;
            background: #f97316;

            padding: 12px 30px;
            border-radius: 40px;

            transition: all 0.3s;
        }
        
        .btn-home:hover {

        }
        
        .btn-home-success {

        }
        
        .btn-home-success:hover {
            box-shadow: 0 4px 12px rgba(34,197,94,0.3);
        }
        
        @media (max-width: 640px) {
            body { padding: 20px 12px; }
            .confirm-body { padding: 20px; }
            .confirm-header { padding: 24px 20px; }

            .total-row .info-value { font-size: 18px; }

<body>
    <div class="confirm-container">
        <div id="loadingContent" class="loading">
            <i class="fa fa-spinner spinner"></i>
            <p>Cargando información del pedido...</p>
        </div>
        
        <div id="mainContent" style="display: none;"></div>
    </div>

    <!-- ========== SCRIPTS ========== -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Configuración de Supabase -->
    <script src="/js/komerzio-config.js"></script>

    <script type="module">
        // ============================================================
        // IMPORTAR CONFIGURACIÓN DE SUPABASE
        // ============================================================
        import { supabase } from '/js/supabase-client.js';
        import { auth } from '/js/auth.js';
        
        console.log('✅ pago-efectivo.html - Inicializado con Supabase');
        
        // ============================================================
        // CONSTANTES
        // ============================================================
        const NUMERO_KOMERZIO = '5356591892';
        const TIEMPO_LIMITE_HORAS = 48;
        
        // ============================================================
        // OBTENER ID DE LA URL
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const pedidoId = urlParams.get('id');
        
        // ============================================================
        // VARIABLES GLOBALES
        // ============================================================
        let pedidoData = null;
        let usuario = null;
        let tiempoRestante = TIEMPO_LIMITE_HORAS * 60 * 60;
        let timerInterval = null;

        // ============================================================
        // ACTUALIZAR TIMER
        // ============================================================
        function actualizarTimer() {
            const horas = Math.floor(tiempoRestante / 3600);
            const minutos = Math.floor((tiempoRestante % 3600) / 60);
            const segundos = tiempoRestante % 60;
            
            const timerElement = document.getElementById('timerDisplay');
            if (timerElement) {
                timerElement.textContent = 
                    `${horas.toString().padStart(2, '0')}:${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;
            }
            
            if (tiempoRestante <= 0) {
                clearInterval(timerInterval);
                anularPedido();
            }
            tiempoRestante--;
        }

        // ============================================================
        // ANULAR PEDIDO
        // ============================================================
        async function anularPedido() {
            if (!pedidoData) return;
            try {
                const { error } = await supabase
                    .from('pedidos')
                    .update({ estado: 'anulado' })
                    .eq('id', pedidoId);
                
                if (!error) {
                    Swal.fire({
                        icon: 'warning',
                        title: '⏰ Pedido anulado',
                        text: 'El tiempo para confirmar ha expirado. Tu pedido ha sido cancelado.',
                        confirmButtonText: 'Entendido'
                    }).then(() => {
                        window.location.href = '/mi-cuenta.html';
                    });
                }
            } catch (error) {
                console.error('Error anulando pedido:', error);
            }
        }

        // ============================================================
        // ENVIAR WHATSAPP
        // ============================================================
        window.enviarWhatsApp = function() {
            if (!pedidoData) return;
            
            const esCUP = pedidoData.metodo_pago === 'efectivo_cup';
            const moneda = esCUP ? 'CUP' : 'USD';
            const totalMostrar = esCUP ? pedidoData.total_cup : pedidoData.total;
            
            const items = pedidoData.items || [];
            let productosTexto = '';
            items.forEach(item => {
                productosTexto += `• ${item.nombre} x${item.cantidad} = $${(item.precio * item.cantidad).toFixed(2)} USD\n`;
            });
            
            const mensaje = `📦 *NUEVO PEDIDO - CONFIRMAR*\n\n` +
                `*Pedido #:* ${pedidoId.slice(0, 8)}\n` +
                `*Cliente:* ${pedidoData.cliente?.nombre || 'Cliente'}\n` +
                `*Teléfono:* ${pedidoData.cliente?.telefono || 'No especificado'}\n` +
                `*Dirección:* ${pedidoData.cliente?.direccion || 'No especificada'}\n` +
                `*Localidad:* ${pedidoData.cliente?.localidad || 'No especificada'}\n\n` +
                `*Productos:*\n${productosTexto}\n` +
                `*Total a pagar:* $${(totalMostrar || pedidoData.total)?.toFixed(2)} ${moneda}\n` +
                (esCUP ? `*Tasa aplicada:* 1 USD = ${pedidoData.tasa_aplicada} CUP\n` : '') +
                `\n✅ *El cliente ha confirmado su pedido y acepta los términos.*\n\n` +
                `Por favor, coordinar la entrega.`;
            
            const mensajeCodificado = encodeURIComponent(mensaje);
            window.open(`https://wa.me/${NUMERO_KOMERZIO}?text=${mensajeCodificado}`, '_blank');
        };

        // ============================================================
        // CONFIRMAR PEDIDO
        // ============================================================
        window.confirmarPedido = async function() {
            const btn = document.getElementById('confirmBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Procesando...';
            
            try {
                const { error } = await supabase
                    .from('pedidos')
                    .update({ estado: 'confirmado' })
                    .eq('id', pedidoId);
                
                if (error) throw error;
                
                Swal.fire({
                    icon: 'success',
                    title: '🎉 ¡Pedido confirmado!',
                    text: 'Tu pedido ha sido confirmado. En breve nos comunicaremos contigo.',
                    confirmButtonText: 'Ver mis pedidos'
                }).then(() => {
                    window.location.href = '/mi-cuenta.html';
                });
                
            } catch (error) {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error.message || 'No se pudo confirmar el pedido',
                    confirmButtonText: 'Intentar de nuevo'
                });
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-check-circle"></i> Confirmar compra';
            }
        };

        // ============================================================
        // CARGAR PEDIDO
        // ============================================================
        async function cargarPedido() {
            const loadingContent = document.getElementById('loadingContent');
            
            if (!pedidoId) {
                loadingContent.innerHTML = `
                    <div class="error">
                        <i class="fa fa-exclamation-triangle"></i>
                        <h2>Pedido no encontrado</h2>
                        <p>No se encontró información del pedido.</p>
                        <a href="/" class="btn-home">Ir al inicio</a>
                    </div>
                `;
                return;
            }
            
            try {
                // Verificar autenticación
                if (auth.isAuthenticated()) {
                    usuario = auth.getUsuario();
                    console.log('👤 Usuario autenticado:', usuario?.email);
                } else {
                    console.log('⚠️ Usuario no autenticado');
                }
                
                console.log('🔍 Buscando pedido:', pedidoId);
                
                const { data, error } = await supabase
                    .from('pedidos')
                    .select('*')
                    .eq('id', pedidoId)
                    .single();
                
                if (error) {
                    console.error('❌ Error en consulta:', error);
                    throw new Error('Pedido no encontrado');
                }
                
                if (!data) {
                    throw new Error('Pedido no encontrado');
                }
                
                pedidoData = data;
                console.log('✅ Pedido cargado:', pedidoData.id);
                console.log('📦 Método de pago:', pedidoData.metodo_pago);
                
                // Verificar estados
                if (data.estado === 'confirmado') {
                    loadingContent.innerHTML = `
                        <div class="error" style="color: #22c55e;">
                            <i class="fa fa-check-circle" style="color: #22c55e;"></i>
                            <h2 style="color: #22c55e;">🎉 ¡Pedido ya confirmado!</h2>
                            <p style="color: #64748b;">Este pedido ya ha sido confirmado anteriormente.</p>
                            <a href="/mi-cuenta.html" class="btn-home btn-home-success">Ver mis pedidos</a>
                        </div>
                    `;
                    return;
                }
                
                if (data.estado === 'anulado') {
                    loadingContent.innerHTML = `
                        <div class="error">
                            <i class="fa fa-clock-o"></i>
                            <h2>⏰ Pedido expirado</h2>
                            <p>El tiempo para confirmar este pedido ha expirado.</p>
                            <a href="/" class="btn-home">Ir al inicio</a>
                        </div>
                    `;
                    return;
                }
                
                // Calcular tiempo restante
                const fechaCreacion = new Date(data.created_at);
                const ahora = new Date();
                const diffHoras = (ahora - fechaCreacion) / (1000 * 60 * 60);
                
                if (diffHoras > TIEMPO_LIMITE_HORAS) {
                    await anularPedido();
                    return;
                }
                
                const segundosTranscurridos = Math.floor((ahora - fechaCreacion) / 1000);
                tiempoRestante = Math.max(0, (TIEMPO_LIMITE_HORAS * 60 * 60) - segundosTranscurridos);
                
                renderizarContenido();
                
                if (tiempoRestante > 0) {
                    timerInterval = setInterval(actualizarTimer, 1000);
                }
                
            } catch (error) {
                console.error('❌ Error cargando pedido:', error);
                loadingContent.innerHTML = `
                    <div class="error">
                        <i class="fa fa-exclamation-triangle"></i>
                        <h2>Error al cargar el pedido</h2>
                        <p>${error.message || 'No se pudo cargar la información del pedido.'}</p>
                        <a href="/" class="btn-home">Ir al inicio</a>
                    </div>
                `;
            }
        }

        // ============================================================
        // RENDERIZAR CONTENIDO
        // ============================================================
        function renderizarContenido() {
            document.getElementById('loadingContent').style.display = 'none';
            const container = document.getElementById('mainContent');
            container.style.display = 'block';
            
            const items = pedidoData.items || [];
            
            const esCUP = pedidoData.metodo_pago === 'efectivo_cup';
            const moneda = esCUP ? 'CUP' : 'USD';
            const simbolo = '$';
            const totalMostrar = esCUP ? pedidoData.total_cup : pedidoData.total;
            
            let productosHtml = '';
            items.forEach(item => {
                productosHtml += `
                    <div class="product-item">
                        <img src="${item.imagen_url || '/assets/images/no-image.jpg'}" onerror="this.src='/assets/images/no-image.jpg'">
                        <div class="product-details">
                            <div class="product-name">${item.nombre}</div>
                            <div class="product-meta">Cantidad: ${item.cantidad}</div>
                        </div>
                        <div class="product-price">${simbolo}${(item.precio * item.cantidad).toFixed(2)}</div>
                    </div>
                `;
            });
            
            container.innerHTML = `
                <div class="confirm-header">
                    <h1><i class="fa fa-hand-peace-o"></i> ¡Casi listo!</h1>
                    <div class="order-id">Pedido #${pedidoId.slice(0, 8)}</div>
                </div>
                
                <div class="confirm-body">
                    <div class="status-card">
                        <i class="fa fa-clock-o"></i>
                        <div>
                            <h3>⏳ Pedido pendiente de confirmación</h3>
                            <p>Por favor confirma tu compra en los próximos ${TIEMPO_LIMITE_HORAS} horas</p>
                        </div>
                    </div>
                    
                    <div class="warning-card">
                        <i class="fa fa-exclamation-triangle"></i>
                        <div>
                            <h3>⚠️ Importante</h3>
                            <p>Si no confirmas en ${TIEMPO_LIMITE_HORAS} horas, el pedido se anulará automáticamente.</p>
                        </div>
                    </div>
                    
                    <div class="timer">
                        <strong><i class="fa fa-hourglass-half"></i> Tiempo restante:</strong>
                        <span id="timerDisplay">--:--:--</span>
                    </div>
                    
                    <div class="info-card">
                        <h3><i class="fa fa-shopping-cart"></i> Resumen del pedido</h3>
                        <div class="products-list">${productosHtml}</div>
                        
                        <div class="info-row">
                            <span class="info-label">Subtotal:</span>
                            <span class="info-value">${simbolo}${(pedidoData.subtotal || 0).toFixed(2)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Envío:</span>
                            <span class="info-value">${simbolo}${(pedidoData.envio || 0).toFixed(2)}</span>
                        </div>
                        ${pedidoData.descuento > 0 ? `
                            <div class="info-row">
                                <span class="info-label">Descuento:</span>
                                <span class="info-value" style="color: #22c55e;">-${simbolo}${pedidoData.descuento.toFixed(2)}</span>
                            </div>
                        ` : ''}
                        <div class="total-row">
                            <span class="info-label">Total a pagar:</span>
                            <span class="info-value">${simbolo}${(totalMostrar || pedidoData.total || 0).toFixed(2)} ${moneda}</span>
                        </div>
                        ${esCUP && pedidoData.tasa_aplicada ? `
                            <div class="info-row" style="font-size: 12px; color: #64748b; border-top: 1px dashed #e2e8f0; margin-top: 10px; padding-top: 10px;">
                                <span>Tasa aplicada:</span>
                                <span>1 USD = ${pedidoData.tasa_aplicada} CUP</span>
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="info-card">
                        <h3><i class="fa fa-user"></i> Datos del cliente</h3>
                        <div class="info-row">
                            <span class="info-label">Nombre:</span>
                            <span class="info-value">${pedidoData.cliente?.nombre || 'No especificado'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Teléfono:</span>
                            <span class="info-value">${pedidoData.cliente?.telefono || 'No especificado'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Dirección:</span>
                            <span class="info-value">${pedidoData.cliente?.direccion || 'No especificada'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Localidad:</span>
                            <span class="info-value">${pedidoData.cliente?.localidad || 'No especificada'}</span>
                        </div>
                    </div>
                    
                    <div class="whatsapp-card">
                        <div class="whatsapp-info">
                            <i class="fa fa-whatsapp"></i>
                            <div>
                                <span>Notificar a KOMERZIO</span>
                                <p>Envía un mensaje para coordinar la entrega</p>
                            </div>
                        </div>
                        <button class="btn-whatsapp" onclick="window.enviarWhatsApp()">
                            <i class="fa fa-whatsapp"></i> Notificar a KOMERZIO
                        </button>
                    </div>
                    
                    <button class="btn-confirm" id="confirmBtn" onclick="window.confirmarPedido()">
                        <i class="fa fa-check-circle"></i> Confirmar compra
                    </button>
                    
                    <p style="text-align: center; margin-top: 16px; font-size: 12px; color: #94a3b8;">
                        <i class="fa fa-shield"></i> Al confirmar aceptas que el pago se realizará contra entrega
                    </p>
                </div>
            `;
            
            // Inicializar timer
            actualizarTimer();
        }

        // ============================================================
        // INICIALIZAR
        // ============================================================
        cargarPedido();
    </script>
</body>
</html>
