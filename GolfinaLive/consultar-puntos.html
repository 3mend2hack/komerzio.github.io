<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Puntos</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0a0a1a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            border: 2px solid #ffd700;
            box-shadow: 0 20px 60px rgba(255,215,0,0.1);
        }
        .icon {
            font-size: 4em;
            margin-bottom: 10px;
        }
        .title {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffd700;
        }
        .points-value {
            font-size: 4em;
            font-weight: bold;
            color: #ffd700;
            margin: 20px 0;
            text-shadow: 0 0 40px rgba(255,215,0,0.3);
        }
        .user-name {
            font-size: 1.2em;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .detail {
            font-size: 0.8em;
            opacity: 0.5;
            margin-top: 20px;
        }
        .team-badge {
            display: inline-block;
            padding: 4px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            margin-top: 5px;
        }
        .team-badge.rojo {
            background: rgba(255,68,68,0.3);
            color: #ff4444;
            border: 1px solid #ff4444;
        }
        .team-badge.azul {
            background: rgba(68,68,255,0.3);
            color: #4444ff;
            border: 1px solid #4444ff;
        }
        .team-badge.neutral {
            background: rgba(255,215,0,0.3);
            color: #ffd700;
            border: 1px solid #ffd700;
        }
        .error-card {
            border-color: #ff4444;
            box-shadow: 0 20px 60px rgba(255,68,68,0.1);
        }
        .error-card .title {
            color: #ff4444;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .stat-item {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 10px;
        }
        .stat-item .label {
            font-size: 0.7em;
            opacity: 0.5;
            text-transform: uppercase;
        }
        .stat-item .value {
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 3px;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="card" id="resultCard">
            <div class="icon">⏳</div>
            <div class="title">Consultando...</div>
            <div style="opacity:0.6;">Verificando tus puntos</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://qddfdisbnwnnlvkrnckd.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZGZkaXNibndubmx2a3JuY2tkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NDQwMzcsImV4cCI6MjEwMjQyMDAzN30.9Jsgl0qepqjJ8oiiewyPZK3vOsqm49EnLCEtOar5MiQ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('user') || 'Anónimo';
        const resultCard = document.getElementById('resultCard');

        async function getPoints() {
            try {
                const { data, error } = await supabase
                    .from('jugadores')
                    .select('*')
                    .eq('nombre', userName)
                    .maybeSingle();

                if (error) {
                    throw new Error(error.message);
                }

                const points = data?.puntos || 0;
                const color = data?.color || 'neutral';
                const partidasJugadas = data?.partidas_jugadas || 0;
                const poderesUsados = data?.poderes_usados || 0;

                const teamLabel = color === 'rojo' ? '🇵🇹 RONALDO' : 
                                 color === 'azul' ? '🇦🇷 MESSI' : '⚡ SIN EQUIPO';
                const teamClass = color === 'rojo' ? 'rojo' : color === 'azul' ? 'azul' : 'neutral';

                resultCard.className = 'card';
                resultCard.innerHTML = `
                    <div class="icon">💰</div>
                    <div class="title">Tus Puntos</div>
                    <div class="user-name">${userName}</div>
                    <div class="team-badge ${teamClass}">${teamLabel}</div>
                    <div class="points-value">${points}</div>
                    <div class="stats">
                        <div class="stat-item">
                            <div class="label">Partidas Jugadas</div>
                            <div class="value">${partidasJugadas}</div>
                        </div>
                        <div class="stat-item">
                            <div class="label">Poderes Usados</div>
                            <div class="value">${poderesUsados}</div>
                        </div>
                    </div>
                    <div class="detail">
                        💡 Ganas 2 puntos por minuto viendo el directo
                    </div>
                `;

            } catch (error) {
                resultCard.className = 'card error-card';
                resultCard.innerHTML = `
                    <div class="icon">⚠️</div>
                    <div class="title">Error</div>
                    <div style="color: #ff6b6b; margin: 10px 0;">${error.message}</div>
                    <div class="detail" style="margin-top: 10px;">
                        Usuario: <strong>${userName}</strong>
                    </div>
                `;
                console.error('Error:', error);
            }
        }

        getPoints();
    </script>
</body>
</html>
