<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activando poder...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #1a1a2e;
            color: white;
            flex-direction: column;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #16213e;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
        }
        h1 { color: #f5c842; margin-bottom: 10px; }
        .icono { font-size: 60px; margin: 20px 0; }
        .mensaje { font-size: 18px; margin: 15px 0; padding: 15px; border-radius: 10px; }
        .exito { background: #2ecc71; color: #fff; }
        .error { background: #e74c3c; color: #fff; }
        .info { background: #3498db; color: #fff; }
        .puntos { font-size: 14px; color: #aaa; margin-top: 10px; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f5c842;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Activando poder...</h1>
        <div id="contenido">
            <div class="loading"></div>
            <p style="margin-top: 20px;">⏳ Procesando...</p>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURACIÓN DE SUPABASE
        // ============================================================
        const SUPABASE_URL = 'https://qddfdisbnwnnlvkrnckd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZGZkaXNibndubmx2a3JuY2tkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NDQwMzcsImV4cCI6MjEwMjQyMDAzN30.9Jsgl0qepqjJ8oiiewyPZK3vOsqm49EnLCEtOar5MiQ';

        // ============================================================
        // OBTENER PARÁMETROS DE LA URL
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const poder = urlParams.get('poder');
        const user = urlParams.get('user') || 'Anonimo';
        const channel = urlParams.get('channel') || 'golfinalive';

        // ============================================================
        // COSTOS DE CADA PODER
        // ============================================================
        const COSTOS = {
            'ronaldo': 20,
            'messi': 20,
            'lento': 15,
            'gol': 50,
            'caos': 30,
            'ayuda': 0
        };

        // ============================================================
        // FUNCIÓN PARA CONSULTAR PUNTOS DEL USUARIO
        // ============================================================
        async function obtenerPuntosUsuario(nombre) {
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/jugadores?select=puntos&nombre=eq.${encodeURIComponent(nombre)}&channel=eq.${encodeURIComponent(channel)}&limit=1`,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    }
                );
                if (!response.ok) return 0;
                const data = await response.json();
                return data.length > 0 ? data[0].puntos || 0 : 0;
            } catch (error) {
                console.error('Error al obtener puntos:', error);
                return 0;
            }
        }

        // ============================================================
        // FUNCIÓN PARA ACTUALIZAR PUNTOS DEL USUARIO
        // ============================================================
        async function actualizarPuntosUsuario(nombre, nuevosPuntos) {
            try {
                // Verificar si el usuario existe
                const checkResponse = await fetch(
                    `${SUPABASE_URL}/rest/v1/jugadores?select=id&nombre=eq.${encodeURIComponent(nombre)}&channel=eq.${encodeURIComponent(channel)}&limit=1`,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    }
                );
                const existing = await checkResponse.json();

                if (existing.length > 0) {
                    // Actualizar usuario existente
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/jugadores?id=eq.${existing[0].id}`,
                        {
                            method: 'PATCH',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ puntos: nuevosPuntos })
                        }
                    );
                } else {
                    // Crear nuevo usuario
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/jugadores`,
                        {
                            method: 'POST',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                nombre: nombre,
                                channel: channel,
                                puntos: nuevosPuntos
                            })
                        }
                    );
                }
                return true;
            } catch (error) {
                console.error('Error al actualizar puntos:', error);
                return false;
            }
        }

        // ============================================================
        // FUNCIÓN PARA REGISTRAR EVENTO EN SUPABASE
        // ============================================================
        async function registrarEvento(tipo, usuario, poder, puntos) {
            try {
                await fetch(
                    `${SUPABASE_URL}/rest/v1/eventos`,
                    {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            tipo: tipo,
                            usuario: usuario,
                            poder: poder,
                            puntos: puntos,
                            channel: channel
                        })
                    }
                );
            } catch (error) {
                console.error('Error al registrar evento:', error);
            }
        }

        // ============================================================
        // FUNCIÓN PARA REGISTRAR PODER EN SUPABASE (tabla poderes)
        // ============================================================
        async function registrarPoder(tipo, usuario) {
            try {
                await fetch(
                    `${SUPABASE_URL}/rest/v1/poderes`,
                    {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            poder: tipo,
                            usuario: usuario,
                            channel: channel,
                            timestamp: new Date().toISOString()
                        })
                    }
                );
            } catch (error) {
                console.error('Error al registrar poder:', error);
            }
        }

        // ============================================================
        // FUNCIÓN PRINCIPAL PARA ACTIVAR PODER
        // ============================================================
        async function activarPoder() {
            const contenido = document.getElementById('contenido');

            // Validar que el poder existe
            if (!poder) {
                contenido.innerHTML = `
                    <div class="icono">❌</div>
                    <div class="mensaje error">Error: No se especificó ningún poder.</div>
                    <p class="puntos">Usa: ?poder=ronaldo</p>
                `;
                return;
            }

            // Verificar si el poder tiene costo definido
            const costo = COSTOS[poder];
            if (costo === undefined) {
                contenido.innerHTML = `
                    <div class="icono">❓</div>
                    <div class="mensaje error">Poder "${poder}" no válido.</div>
                    <p class="puntos">Poderes disponibles: ronaldo, messi, lento, gol, caos, ayuda</p>
                `;
                return;
            }

            // Si es !ayuda (gratis)
            if (poder === 'ayuda') {
                contenido.innerHTML = `
                    <div class="icono">📖</div>
                    <div class="mensaje info">¡AYUDA ACTIVADA!</div>
                    <p><b>Comandos disponibles:</b><br>
                    !ronaldo (20 pts) - ¡GOOOOL!<br>
                    !messi (20 pts) - ¡GOOOOL!<br>
                    !lento (15 pts) - Ralentiza el juego<br>
                    !gol (50 pts) - ¡GOL SEGURO!<br>
                    !caos (30 pts) - Todo se mueve<br>
                    !puntos - Ver tus puntos</p>
                    <p class="puntos">Usuario: ${user}</p>
                `;
                return;
            }

            // ============================================================
            // PROCESAR PODER CON COSTO
            // ============================================================
            try {
                // 1. Obtener puntos actuales
                const puntosActuales = await obtenerPuntosUsuario(user);

                // 2. Verificar si tiene suficientes puntos
                if (puntosActuales < costo) {
                    contenido.innerHTML = `
                        <div class="icono">🚫</div>
                        <div class="mensaje error">❌ ¡Puntos insuficientes!</div>
                        <div style="background: #2d2d4a; padding: 15px; border-radius: 10px; margin: 10px 0;">
                            <p style="margin: 5px 0;"><b>${user}</b></p>
                            <p style="margin: 5px 0;">Tienes: <b>${puntosActuales}</b> puntos</p>
                            <p style="margin: 5px 0;">Necesitas: <b>${costo}</b> puntos</p>
                            <p style="margin: 5px 0; color: #f5c842;">Te faltan: <b>${costo - puntosActuales}</b> puntos</p>
                        </div>
                        <p class="puntos">💡 Gana puntos viendo el directo (2 pts/minuto)</p>
                    `;
                    return;
                }

                // 3. Calcular nuevos puntos
                const nuevosPuntos = puntosActuales - costo;

                // 4. Actualizar puntos en Supabase
                const actualizado = await actualizarPuntosUsuario(user, nuevosPuntos);

                if (!actualizado) {
                    contenido.innerHTML = `
                        <div class="icono">⚠️</div>
                        <div class="mensaje error">Error al actualizar puntos. Intenta de nuevo.</div>
                    `;
                    return;
                }

                // 5. Registrar evento
                await registrarEvento('poder_activado', user, poder, costo);

                // 6. Registrar poder en tabla poderes
                await registrarPoder(poder, user);

                // 7. Mostrar mensaje de éxito
                let mensajePoder = '';
                let emoji = '⚡';
                switch(poder) {
                    case 'ronaldo': mensajePoder = '🇵🇹 ¡RONALDO ACTIVADO! El Bicho va por el gol'; emoji = '🐐'; break;
                    case 'messi': mensajePoder = '🇦🇷 ¡MESSI ACTIVADO! La Pulga hace magia'; emoji = '🐐'; break;
                    case 'lento': mensajePoder = '🐢 ¡MODO LENTO! Todo se ralentiza'; emoji = '⏳'; break;
                    case 'gol': mensajePoder = '⚽ ¡GOL SEGURO! La bola va directo al arco'; emoji = '🎯'; break;
                    case 'caos': mensajePoder = '🌀 ¡CAOS! Todo se mueve sin control'; emoji = '💥'; break;
                    default: mensajePoder = `¡${poder.toUpperCase()} ACTIVADO!`; break;
                }

                contenido.innerHTML = `
                    <div class="icono">${emoji}</div>
                    <div class="mensaje exito">✅ ¡${mensajePoder}!</div>
                    <div style="background: #2d2d4a; padding: 15px; border-radius: 10px; margin: 10px 0;">
                        <p style="margin: 5px 0;"><b>${user}</b></p>
                        <p style="margin: 5px 0;">💰 Puntos gastados: <b>-${costo}</b></p>
                        <p style="margin: 5px 0;">🏦 Puntos restantes: <b>${nuevosPuntos}</b></p>
                    </div>
                    <p class="puntos">⚡ ¡El poder se ha activado en el juego!</p>
                `;

            } catch (error) {
                console.error('Error en activarPoder:', error);
                contenido.innerHTML = `
                    <div class="icono">💥</div>
                    <div class="mensaje error">Error al procesar el poder. Intenta de nuevo.</div>
                    <p class="puntos">${error.message}</p>
                `;
            }
        }

        // ============================================================
        // EJECUTAR AL CARGAR LA PÁGINA
        // ============================================================
        window.onload = activarPoder;
    </script>
</body>
</html>
