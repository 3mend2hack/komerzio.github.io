<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activar Poder</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0a0a1a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .success {
            border-color: #00ff88;
            box-shadow: 0 0 40px rgba(0,255,136,0.1);
        }
        .error {
            border-color: #ff4444;
            box-shadow: 0 0 40px rgba(255,68,68,0.1);
        }
        .icon {
            font-size: 4em;
            margin-bottom: 10px;
        }
        .title {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.2em;
            margin-bottom: 15px;
            opacity: 0.8;
        }
        .detail {
            font-size: 0.9em;
            opacity: 0.6;
        }
        .team-badge {
            display: inline-block;
            padding: 4px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            margin-top: 5px;
        }
        .team-badge.rojo {
            background: rgba(255,68,68,0.3);
            color: #ff4444;
            border: 1px solid #ff4444;
        }
        .team-badge.azul {
            background: rgba(68,68,255,0.3);
            color: #4444ff;
            border: 1px solid #4444ff;
        }
        .team-badge.neutral {
            background: rgba(255,215,0,0.3);
            color: #ffd700;
            border: 1px solid #ffd700;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="card" id="resultCard">
            <div id="resultContent">
                <div class="icon">⏳</div>
                <div class="title">Procesando...</div>
                <div class="subtitle">Verificando tu solicitud</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://qddfdisbnwnnlvkrnckd.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkZGZkaXNibndubmx2a3JuY2tkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NDQwMzcsImV4cCI6MjEwMjQyMDAzN30.9Jsgl0qepqjJ8oiiewyPZK3vOsqm49EnLCEtOar5MiQ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const comando = urlParams.get('poder')?.toLowerCase();
        const userName = urlParams.get('user') || 'Anónimo';

        const resultCard = document.getElementById('resultCard');
        const resultContent = document.getElementById('resultContent');

        // Mapeo de comandos a nombres de poder en la BD
        const comandoToNombre = {
            'velocidadronaldo': 'Velocidad Ronaldo',
            'velocidadmessi': 'Velocidad Messi',
            'lentoronaldo': 'Lento Ronaldo',
            'lentomessi': 'Lento Messi',
            'golronaldo': 'Gol Ronaldo',
            'golmessi': 'Gol Messi',
            'caosronaldo': 'Caos Ronaldo',
            'caosmessi': 'Caos Messi',
            'escudoronaldo': 'Escudo Ronaldo',
            'escudomessi': 'Escudo Messi',
            'lluviaronaldo': 'Lluvia Ronaldo',
            'lluviamessi': 'Lluvia Messi',
            'congelarronaldo': 'Congelar Ronaldo',
            'congelarmessi': 'Congelar Messi',
            'doblepuntosronaldo': 'Doble Puntos Ronaldo',
            'doblepuntosmessi': 'Doble Puntos Messi',
            'super': 'Super Velocidad',
            'campopequeno': 'Campo Pequeño',
            'invertir': 'Invertir'
        };

        // Determinar equipo beneficiado
        function getTeam(comando) {
            if (comando.includes('ronaldo')) return 'rojo';
            if (comando.includes('messi')) return 'azul';
            return 'neutral';
        }

        async function activatePower() {
            try {
                if (!comando) {
                    throw new Error('No se especificó ningún poder');
                }

                const nombrePoder = comandoToNombre[comando];
                if (!nombrePoder) {
                    throw new Error(`El comando "${comando}" no existe`);
                }

                // Obtener información del poder desde la BD
                const { data: poderInfo, error: poderError } = await supabase
                    .from('poderes_personalizados')
                    .select('*')
                    .eq('comando', comando)
                    .single();

                if (poderError || !poderInfo) {
                    throw new Error(`Poder "${comando}" no encontrado en la base de datos`);
                }

                const costo = poderInfo.costo;
                const duracion = poderInfo.duracion;
                const equipo = getTeam(comando);

                // Buscar partida activa
                const { data: partidaData, error: partidaError } = await supabase
                    .from('partidas')
                    .select('id')
                    .eq('estado', 'activa')
                    .order('creada_en', { ascending: false })
                    .limit(1)
                    .maybeSingle();

                if (partidaData) {
                    await supabase
                        .from('eventos')
                        .insert({
                            partida_id: partidaData.id,
                            usuario: userName,
                            detalle: `Activó ${nombrePoder}`,
                            tipo: 'power',
                            poder: comando,
                            puntos: costo,
                            bando: equipo,
                            creado_en: new Date().toISOString()
                        });
                }

                // Activar poder en tabla poderes
                const expireTime = new Date();
                expireTime.setSeconds(expireTime.getSeconds() + duracion);

                const { data: powerData, error: powerError } = await supabase
                    .from('poderes')
                    .insert({
                        nombre: nombrePoder,
                        usuario: userName,
                        channel: 'GolFinaLive',
                        activo: true,
                        expira_en: expireTime.toISOString(),
                        creado_en: new Date().toISOString()
                    })
                    .select()
                    .single();

                if (powerError) {
                    throw new Error(`Error activando poder: ${powerError.message}`);
                }

                // Mostrar éxito
                const teamLabel = equipo === 'rojo' ? '🇵🇹 RONALDO' : 
                                 equipo === 'azul' ? '🇦🇷 MESSI' : '⚡ NEUTRAL';
                const teamClass = equipo === 'rojo' ? 'rojo' : equipo === 'azul' ? 'azul' : 'neutral';

                resultCard.className = 'card success';
                resultContent.innerHTML = `
                    <div class="icon">⚡</div>
                    <div class="title">¡Poder Activado!</div>
                    <div class="subtitle">
                        <strong style="color: #ffd700;">${nombrePoder}</strong>
                    </div>
                    <div class="team-badge ${teamClass}">${teamLabel}</div>
                    <div style="margin: 10px 0; opacity: 0.7;">
                        por <strong>${userName}</strong>
                    </div>
                    <div style="margin-top: 15px; padding: 10px; background: rgba(255,215,0,0.1); border-radius: 10px;">
                        <div style="font-size: 0.8em; opacity: 0.6;">🎯 Coste: ${costo} puntos · ⏱️ ${duracion}s de duración</div>
                        <div style="font-size: 0.9em; margin-top: 5px; color: #ffd700;">✅ Puntos descontados por Cloudbot</div>
                    </div>
                    <div class="detail" style="margin-top: 15px;">
                        ✅ Poder activado correctamente
                    </div>
                `;

                // Desactivar automáticamente después de la duración
                setTimeout(async () => {
                    try {
                        await supabase
                            .from('poderes')
                            .update({ activo: false })
                            .eq('id', powerData.id);
                    } catch (e) {
                        console.warn('Error desactivando poder:', e);
                    }
                }, duracion * 1000);

            } catch (error) {
                resultCard.className = 'card error';
                resultContent.innerHTML = `
                    <div class="icon">❌</div>
                    <div class="title">Error</div>
                    <div class="subtitle" style="color: #ff6b6b; font-size: 1em;">${error.message}</div>
                    <div class="detail" style="margin-top: 15px;">
                        Usuario: <strong>${userName}</strong><br>
                        Comando: <strong>${comando || 'No especificado'}</strong>
                    </div>
                    <div class="detail" style="margin-top: 20px; opacity: 0.4; font-size: 0.8em;">
                        Comandos disponibles: velocidadronaldo, velocidadmessi, lentoronaldo, lentomessi, golronaldo, golmessi, caosronaldo, caosmessi, escudoronaldo, escudomessi, lluviaronaldo, lluviamessi, congelarronaldo, congelarmessi, doblepuntosronaldo, doblepuntosmessi, super, campopequeno, invertir
                    </div>
                `;
                console.error('Error:', error);
            }
        }

        activatePower();
    </script>
</body>
</html>
