<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fútbol Horizontal Interactivo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- ===================== MODAL DE LOGIN ===================== -->
  <div id="login-overlay" class="modal-overlay open">
    <div class="modal-content login-modal">
      <h2>Acceso Restringido</h2>
      <p>Ingresa tu contraseña para continuar</p>
      <label for="password-input">Contraseña:</label>
      <input type="password" id="password-input" placeholder="Contraseña">
      <div class="modal-buttons">
        <button id="btn-login">Iniciar sesión</button>
      </div>
      <p id="login-error" class="error-message"></p>
    </div>
  </div>

  <!-- ===================== MARCADOR SUPERIOR ===================== -->
  <header class="scoreboard" id="scoreboard">
    <div class="team team-red">
      <div class="player-image" id="player-image-red">
        <img src="https://via.placeholder.com/150/ff4444/ffffff?text=Rojo" alt="Jugador Rojo">
      </div>
      <span class="player-name" id="player-name-red">Rojo</span>
      <span class="score" id="score-red">0</span>
    </div>

    <div class="goal-target">
      <div class="trophy-icon">🏆</div>
      <div class="goal-number" id="goal-target">5</div>
      <div class="goal-label">Goles para ganar</div>
    </div>

    <div class="team team-blue">
      <div class="player-image" id="player-image-blue">
        <img src="https://via.placeholder.com/150/4444ff/ffffff?text=Azul" alt="Jugador Azul">
      </div>
      <span class="player-name" id="player-name-blue">Azul</span>
      <span class="score" id="score-blue">0</span>
    </div>
  </header>

  <!-- ===================== ESTADIO (CANVAS) ===================== -->
  <main class="stadium-container" id="stadium-container">
    <canvas id="game-canvas" width="1200" height="700"></canvas>
    <div id="message-overlay" class="message-overlay">
      <div id="message-text"></div>
    </div>
  </main>

  <!-- ===================== CONTROLES Y AJUSTES ===================== -->
  <section class="controls">
    <div class="control-buttons">
      <button id="btn-start">Iniciar</button>
      <button id="btn-pause">Pausar</button>
      <button id="btn-resume">Reanudar</button>
      <button id="btn-reset">Reiniciar</button>
      <button id="btn-continue">Continuar partida</button>
      <button id="btn-logout" style="background:#e74c3c;">Cerrar sesión</button>
    </div>

    <div class="audio-buttons">
      <button class="audio-btn" data-audio="bienvenida">Bienvenida</button>
      <button class="audio-btn" data-audio="gol_rojo">Gol Rojo</button>
      <button class="audio-btn" data-audio="gol_azul">Gol Azul</button>
      <button class="audio-btn" data-audio="suscribete">Suscríbete</button>
      <button class="audio-btn" data-audio="apoya_estrella">Apoya Estrella</button>
      <button class="audio-btn" data-audio="poder">Poder</button>
      <button class="audio-btn" data-audio="tulike">Tu Like</button>
    </div>

    <button id="toggle-settings" aria-expanded="false">Ajustes de Campo</button>
    <button id="btn-player-names">Configurar Jugadores</button>
    <div class="settings-panel" id="settings-panel">
      <label>Largo del estadio (ancho): <input type="range" id="field-width" min="300" max="1150" value="700"></label>
      <label>Alto del estadio: <input type="range" id="field-height" min="150" max="650" value="400"></label>
      <label>Tamaño imágenes: <input type="range" id="image-size" min="60" max="400" value="160"></label>
      <label>Velocidad de las pelotas: <input type="range" id="ball-speed" min="50" max="500" value="200"></label>
      <label>Tamaño de portería: <input type="range" id="goal-size" min="0.2" max="0.8" step="0.05" value="0.4"></label>
      <label>Goles para ganar: <input type="number" id="goal-target-input" min="1" max="20" value="5"></label>
      <div class="direction-controls">
        <button id="move-up">↑</button>
        <button id="move-down">↓</button>
        <button id="move-left">←</button>
        <button id="move-right">→</button>
      </div>
    </div>
  </section>

  <!-- ===================== MODAL PARA NOMBRES DE JUGADORES ===================== -->
  <div id="player-name-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <h2 id="modal-title">Configurar Jugadores</h2>

      <label for="input-name-red">Nombre del jugador rojo:</label>
      <input type="text" id="input-name-red" placeholder="Ej: Lionel Messi">

      <label for="input-file-red">Imagen del jugador rojo:</label>
      <input type="file" id="input-file-red" accept="image/*">
      <img id="player-image-red-preview" class="image-preview" src="" alt="Previsualización roja">

      <label for="input-name-blue">Nombre del jugador azul:</label>
      <input type="text" id="input-name-blue" placeholder="Ej: Cristiano Ronaldo">

      <label for="input-file-blue">Imagen del jugador azul:</label>
      <input type="file" id="input-file-blue" accept="image/*">
      <img id="player-image-blue-preview" class="image-preview" src="" alt="Previsualización azul">

      <div class="modal-buttons">
        <button id="btn-save-names">Guardar</button>
        <button id="btn-close-modal">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Librería de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
