<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Mi cuenta · KOMERZIO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            color: #0f1111;
            line-height: 1.5;
        }
        .account-container { max-width: 1500px; margin: 40px auto; padding: 0 20px; width: 100%; }
        .account-header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .account-title { display: flex; align-items: center; gap: 15px; }
        .account-title i { font-size: 32px; color: #f08804; }
        .account-title h1 { font-size: 28px; font-weight: 700; color: #0f1111; }
        
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .quick-action-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
            border: 2px solid transparent;
            cursor: pointer;
            text-decoration: none;
            color: #0f1111;
        }
        .quick-action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: #f08804;
        }
        .quick-action-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .quick-action-icon.store { background: #e3f2fd; color: #1976d2; }
        .quick-action-icon.publish { background: #e8f5e9; color: #2e7d32; }
        .quick-action-icon.transfer { background: #e3f2fd; color: #1976d2; }
        .quick-action-icon.receive { background: #e8f5e9; color: #2e7d32; }
        .quick-action-icon.pay { background: #fff3e0; color: #f57c00; }
        .quick-action-icon.usdt { background: #26a17b; color: white; }
        .quick-action-icon.referidos { background: #fce4ec; color: #c62828; }
        .quick-action-content h3 { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
        .quick-action-content p { color: #6c757d; font-size: 13px; }
        
        .balance-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .balance-icon {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }
        .balance-info h3 { font-size: 16px; font-weight: 400; opacity: 0.9; margin-bottom: 5px; }
        .balance-amount { font-size: 36px; font-weight: 700; white-space: nowrap; }
        .balance-amount small { font-size: 14px; font-weight: 400; opacity: 0.8; margin-left: 5px; }
        .balance-actions {
            display: flex;
            gap: 15px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .btn-balance {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            border: none;
            cursor: pointer;
        }
        .btn-balance:hover { background: rgba(255,255,255,0.3); }
        
        .account-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }
        .account-sidebar {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .user-info {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }
        .user-avatar {
            width: 100px;
            height: 100px;
            background: #232f3e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }
        .user-avatar i { font-size: 50px; color: white; }
        .user-name { font-size: 18px; font-weight: 700; margin-bottom: 5px; word-break: break-word; }
        .user-email { color: #6c757d; font-size: 14px; word-break: break-word; }
        
        .account-menu {
            list-style: none;
        }
        .account-menu li { margin-bottom: 5px; }
        .account-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: #0f1111;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 14px;
        }
        .account-menu a:hover { background: #f0f2f5; }
        .account-menu a.active {
            background: #fff6e5;
            color: #f08804;
            font-weight: 600;
        }
        .account-menu i { width: 20px; text-align: center; }
        
        .account-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f2f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .profile-form { max-width: 600px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #0f1111;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #f08804;
            outline: none;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            text-decoration: none;
            white-space: nowrap;
        }
        .btn-primary { background: #ffd814; color: #0f1111; }
        .btn-primary:hover { background: #f7ca00; }
        .btn-secondary { background: #f0f2f5; color: #0f1111; }
        .btn-secondary:hover { background: #e3e6e9; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: white;
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.3);
            animation: modalFadeIn 0.3s;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-header {
            padding: 25px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
            flex-wrap: wrap;
            gap: 10px;
        }
        .modal-header h2 {
            margin: 0;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .close-modal {
            font-size: 28px;
            cursor: pointer;
            color: #6c757d;
        }
        .close-modal:hover { color: #0f1111; }
        .modal-body { padding: 25px; }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        .loading i {
            font-size: 48px;
            color: #009644;
            margin-bottom: 20px;
        }
        
        .mfa-card {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 1px solid #e9ecef;
        }
        .mfa-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .mfa-title {
            font-size: 18px;
            font-weight: 600;
            color: #0f1111;
        }
        .mfa-badge-active {
            background: #28a745;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .mfa-badge-inactive {
            background: #6c757d;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .mfa-description {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 15px;
        }
        .mfa-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        @media screen and (max-width: 1024px) {
            .account-grid { grid-template-columns: 1fr; }
            .account-sidebar { position: static; }
            .quick-actions { grid-template-columns: repeat(2, 1fr); }
        }
        @media screen and (max-width: 768px) {
            .account-container { padding: 0 12px; margin: 20px auto; }
            .account-header { padding: 20px; flex-direction: column; align-items: flex-start; }
            .account-title h1 { font-size: 24px; }
            .quick-actions { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .quick-action-card { padding: 16px; gap: 12px; }
            .quick-action-icon { width: 48px; height: 48px; font-size: 22px; }
            .quick-action-content h3 { font-size: 15px; }
            .quick-action-content p { font-size: 12px; display: none; }
            .balance-card { flex-direction: column; align-items: flex-start; padding: 20px; }
            .balance-icon { margin-bottom: 10px; }
            .balance-amount { font-size: 28px; }
            .balance-actions { margin-left: 0; width: 100%; justify-content: space-between; }
            .btn-balance { flex: 1; justify-content: center; padding: 10px; font-size: 13px; }
            .account-content { padding: 20px; }
            .section-title { font-size: 20px; flex-direction: column; align-items: flex-start; }
            .form-row { grid-template-columns: 1fr; }
        }
        @media screen and (max-width: 480px) {
            .quick-actions { grid-template-columns: 1fr; }
            .balance-actions { flex-direction: column; }
            .btn-balance { width: 100%; }
            .account-sidebar { padding: 15px; }
            .user-avatar { width: 70px; height: 70px; }
            .user-avatar i { font-size: 35px; }
            .user-name { font-size: 16px; }
            .account-menu a { padding: 10px 12px; font-size: 13px; }
        }
    </style>
</head>
<body>

        <div id="accountContent" style="display: none;"></div>

    <!-- ===== SCRIPTS ===== -->

    <!-- 🔥 Cargar configuración de Supabase ANTES de los módulos -->

    <script type="module">

        console.log('✅ mi-cuenta iniciado');
        
        const carrito = initCarrito()

            'La Habana': ['Cerro', 'Centro Habana', 'La Habana Vieja', 'Diez de Octubre', 'Arroyo Naranjo', 'Boyeros', 'Cotorro', 'Guanabacoa', 'Habana del Este', 'La Lisa', 'Marianao', 'Playa', 'Plaza', 'Regla', 'San Miguel del Padrón'],
            'Mayabeque': ['San José de las Lajas', 'Batabanó', 'Bejucal', 'Güines', 'Jaruco', 'Madruga', 'Melena del Sur', 'Nueva Paz', 'Quivicán', 'Santa Cruz del Norte', 'San Nicolás de Bari'],

            'Santiago de Cuba': ['Santiago de Cuba', 'Contramaestre', 'Guamá', 'Mella', 'Palma Soriano', 'San Luis', 'Segundo Frente', 'Songo-La Maya', 'Tercer Frente'],
            'Guantánamo': ['Guantánamo', 'Baracoa', 'Caimanera', 'El Salvador', 'Imías', 'Maisí', 'Manuel Tames', 'Niceto Pérez', 'San Antonio del Sur', 'Yateras'],
            'Isla de la Juventud': ['Nueva Gerona']

        let seccionActual = 'perfil'
        let pedidos = []
        let direcciones = []
        let productosVendedor = []
        let esVendedor = false
        let datosTienda = null
        let mfaActivo = false
        let mfaFactorId = null
        
        // ========== FUNCIONES ==========
        window.recargarSaldo = async function() {
            Swal.fire({
                icon: 'info',
                title: 'Recarga de saldo',
                text: 'La recarga de saldo está disponible en la sección "Recargar con USDT" del menú principal.',
                confirmButtonText: 'Ir a recarga'
            }).then(() => {
                window.location.href = '/recarga.html';
            });
        };
        
        async function cargarSaldoActual() {
            const usuario = auth.getUsuario();
            if (!usuario) return 0;
            try {
                const { data, error } = await supabase.from('saldo_usuarios').select('saldo_actual').eq('user_id', usuario.id).maybeSingle();
                if (error && error.code !== 'PGRST116') throw error;
                return data?.saldo_actual || 0;
            } catch (error) {
                console.error('Error cargando saldo:', error);
                return 0;
            }
        }
        
        window.historialSaldo = async function() {
            Swal.fire({
                icon: 'info',
                title: 'Historial de saldo',
                text: 'La funcionalidad de historial de saldo estará disponible próximamente.',
                confirmButtonText: 'Entendido'
            });
        };
        
        // ========== VERIFICAR VENDEDOR (simplificado) ==========
        async function verificarVendedor() {
            esVendedor = false;
            return false;
        }
        
        // ========== CARGAR PRODUCTOS DEL VENDEDOR (simplificado) ==========
        async function cargarProductosVendedor() {
            productosVendedor = [];
        }
        
        // ========== 2FA ==========
        async function verificarEstado2FA() {
            try {
                const { data: factors, error } = await supabase.auth.mfa.listFactors();
                if (error) throw error;
                const totpFactor = factors.totp.find(f => f.status === 'verified');
                mfaActivo = !!totpFactor;
                if (mfaActivo && totpFactor) mfaFactorId = totpFactor.id;
                return mfaActivo;
            } catch (error) {
                console.error('Error verificando 2FA:', error);
                return false;
            }
        }
        
        window.activar2FA = async function() {
            try {
                const { data: { user }, error: userError } = await supabase.auth.getUser();
                if (userError || !user) throw new Error('Sesión no válida. Recarga la página.');
                
                const { data: existingFactors } = await supabase.auth.mfa.listFactors();
                const existingTotp = existingFactors?.totp?.find(f => f.factor_type === 'totp');
                if (existingTotp) {
                    await supabase.auth.mfa.unenroll({ factorId: existingTotp.id });
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
                
                const { data: factor, error: enrollError } = await supabase.auth.mfa.enroll({ factorType: 'totp' });
                if (enrollError) throw enrollError;
                
                const qrCodeSvg = factor.totp.qr_code;
                const factorId = factor.id;
                sessionStorage.setItem('mfa_factor_id', factorId);
                
                const backupCodes = [];
                for (let i = 0; i < 8; i++) {
                    backupCodes.push(Math.random().toString(36).substring(2, 10).toUpperCase());
                }
                
                const { value: verifyCode } = await Swal.fire({
                    title: 'Configurar Google Authenticator',
                    html: `
                        <div style="text-align: center;">
                            <p>Escanea este código QR con Google Authenticator:</p>
                            <div style="background: white; padding: 20px; border-radius: 12px; margin: 15px 0;">${qrCodeSvg}</div>
                            <p>O introduce este código manualmente:</p>
                            <code style="background: #f0f2f5; padding: 8px 16px; border-radius: 8px; display: inline-block;">${factor.totp.secret}</code>
                            <p style="margin-top: 15px;"><strong>Ingresa el código de 6 dígitos de la aplicación:</strong></p>
                            <input type="text" id="totp-code" class="swal2-input" placeholder="123456" maxlength="6" style="text-align: center; font-size: 20px;">
                        </div>
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Verificar y activar',
                    cancelButtonText: 'Cancelar',
                    preConfirm: () => {
                        const code = document.getElementById('totp-code')?.value;
                        if (!code || code.length !== 6) {
                            Swal.showValidationMessage('Ingresa un código válido de 6 dígitos');
                            return false;
                        }
                        return code;
                    }
                });
                
                if (!verifyCode) return;
                
                const { data: challenge, error: challengeError } = await supabase.auth.mfa.challenge({ factorId });
                if (challengeError) throw challengeError;
                
                const { error: verifyError } = await supabase.auth.mfa.verify({
                    factorId,
                    challengeId: challenge.id,
                    code: verifyCode
                });
                if (verifyError) throw verifyError;
                
                const usuario = auth.getUsuario();
                if (usuario) {
                    await supabase
                        .from('perfiles')
                        .update({ mfa_activo: true, mfa_backup_codes: backupCodes })
                        .eq('id', usuario.id);
                }
                
                mfaActivo = true;
                mfaFactorId = factorId;
                
                await Swal.fire({
                    title: '¡2FA activado correctamente!',
                    html: `
                        <div style="text-align: center;">
                            <p><strong>Guarda estos códigos de respaldo en un lugar seguro.</strong></p>

        window.desactivar2FA = async function() {
            if (!mfaFactorId) {
                Swal.fire('Error', 'No se encontró el factor 2FA', 'error');
                return;
            }
            
            const { value: code } = await Swal.fire({
                title: 'Desactivar 2FA',
                html: '<p>Ingresa el código de 6 dígitos de Google Authenticator:</p><input type="text" id="totp-code" class="swal2-input" placeholder="123456" maxlength="6" style="text-align: center; font-size: 20px;">',
                showCancelButton: true,
                confirmButtonText: 'Desactivar',
                cancelButtonText: 'Cancelar',
                preConfirm: () => {
                    const totpCode = document.getElementById('totp-code')?.value;
                    if (!totpCode || totpCode.length !== 6) {
                        Swal.showValidationMessage('Ingresa un código válido de 6 dígitos');
                        return false;
                    }
                    return totpCode;
                }
            });
            
            if (!code) return;
            
            try {
                const { data: challenge, error: challengeError } = await supabase.auth.mfa.challenge({ factorId: mfaFactorId });
                if (challengeError) throw challengeError;
                
                const { error: verifyError } = await supabase.auth.mfa.verify({
                    factorId: mfaFactorId,
                    challengeId: challenge.id,
                    code: code
                });
                if (verifyError) throw verifyError;
                
                const { error: unenrollError } = await supabase.auth.mfa.unenroll({ factorId: mfaFactorId });
                if (unenrollError) throw unenrollError;
                
                const usuario = auth.getUsuario();
                if (usuario) {
                    await supabase
                        .from('perfiles')
                        .update({ mfa_activo: false, mfa_backup_codes: null })
                        .eq('id', usuario.id);
                }
                
                mfaActivo = false;
                mfaFactorId = null;
                
                Swal.fire({ icon: 'success', title: '2FA desactivado', confirmButtonText: 'Entendido' });
                
                const contentArea = document.getElementById('accountContentArea');
                if (contentArea && seccionActual === 'seguridad') {
                    contentArea.innerHTML = renderizarSeguridad();
                }
                
            } catch (error) {
                console.error('Error desactivando 2FA:', error);
                Swal.fire('Error', 'Código incorrecto o error', 'error');
            }
        };
        
        window.verCodigosRespaldo2FA = async function() {
            const usuario = auth.getUsuario();
            if (!usuario) return;
            const { data: perfil, error } = await supabase
                .from('perfiles')
                .select('mfa_backup_codes')
                .eq('id', usuario.id)
                .single();
            if (error || !perfil?.mfa_backup_codes || perfil.mfa_backup_codes.length === 0) {
                Swal.fire({ title: 'Sin códigos', text: 'No hay códigos de respaldo guardados.', icon: 'info' });
                return;
            }
            Swal.fire({
                title: 'Códigos de respaldo',
                html: `<div style="text-align:center;"><div style="background:#f0f2f5;padding:15px;border-radius:8px;font-family:monospace;font-size:14px;text-align:left;">${perfil.mfa_backup_codes.map(c => `<div>🔑 ${c}</div>`).join('')}</div><p style="font-size:12px;color:#dc3545;margin-top:10px;">No los compartas.</p></div>`,
                icon: 'info',
                confirmButtonText: 'Entendido'
            });
        };
        
        window.regenerarCodigosRespaldo2FA = async function() {
            if (!mfaFactorId) {
                Swal.fire('Error', '2FA no activado', 'error');
                return;
            }
            const { value: code } = await Swal.fire({
                title: 'Regenerar códigos',
                html: '<p>Ingresa el código de 6 dígitos:</p><input type="text" id="totp-code" class="swal2-input" placeholder="123456" maxlength="6">',
                showCancelButton: true,
                confirmButtonText: 'Regenerar',
                preConfirm: () => {
                    const c = document.getElementById('totp-code')?.value;
                    if (!c || c.length !== 6) { Swal.showValidationMessage('Código inválido'); return false; }
                    return c;
                }
            });
            if (!code) return;
            
            try {
                const { data: challenge, error: challengeError } = await supabase.auth.mfa.challenge({ factorId: mfaFactorId });
                if (challengeError) throw challengeError;
                const { error: verifyError } = await supabase.auth.mfa.verify({
                    factorId: mfaFactorId,
                    challengeId: challenge.id,
                    code: code
                });
                if (verifyError) throw verifyError;
                
                const newCodes = [];
                for (let i = 0; i < 8; i++) newCodes.push(Math.random().toString(36).substring(2, 10).toUpperCase());
                const usuario = auth.getUsuario();
                if (usuario) {
                    await supabase.from('perfiles').update({ mfa_backup_codes: newCodes }).eq('id', usuario.id);
                }
                await Swal.fire({
                    title: 'Nuevos códigos',
                    html: `<div style="background:#f0f2f5;padding:15px;border-radius:8px;font-family:monospace;">${newCodes.map(c => `<div>🔑 ${c}</div>`).join('')}</div>`,
                    icon: 'success'
                });
            } catch (error) {
                Swal.fire('Error', 'Código incorrecto', 'error');
            }
        };

                    await supabase.from('perfiles').delete().eq('id', usuario.id);
                    await auth.cerrarSesion();
                    Swal.fire({ icon: 'success', title: 'Cuenta eliminada', text: 'Lamentamos verte ir.', confirmButtonText: 'Ir al inicio' }).then(() => { window.location.href = '/'; });
                } catch (error) {
                    Swal.fire('Error', error.message || 'No se pudo eliminar la cuenta', 'error');
                }
            }
        };
        
        window.cerrarSesion = async function() {
            const result = await Swal.fire({ title: '¿Cerrar sesión?', icon: 'question', showCancelButton: true, confirmButtonText: 'Sí', cancelButtonText: 'Cancelar' });
            if (result.isConfirmed) { await auth.cerrarSesion(); window.location.href = '/'; }
        };
        
        window.cerrarModal = function() { document.getElementById('orderModal').style.display = 'none'; };
        
        // ========== INICIALIZAR ==========
        async function iniciar() {
            for (let i = 0; i < 25; i++) {
                if (auth.getUsuario()) break;
                await new Promise(r => setTimeout(r, 200));
            }
            const usuario = auth.getUsuario();
            if (!usuario) { window.location.href = '/login.html'; return; }
            await cargarDatos();
        }
        iniciar();
    </script>
</body>
</html>
