<!-- ============================================================
     PANEL DE NOTIFICACIONES FLOTANTE - KOMERZIO
     ============================================================ -->
<div id="notificaciones-container" style="display: none;">
    <!-- Icono de campana -->
    <div class="notificaciones-icon" onclick="window.toggleNotificacionesPanel()">
        <i class="fa fa-bell"></i>
        <span id="notificaciones-badge" class="notificaciones-badge">0</span>
    </div>
    
    <!-- Panel de notificaciones -->
    <div id="notificaciones-panel" class="notificaciones-panel">
        <div class="notificaciones-header">
            <h3><i class="fa fa-bell" style="color: #f97316;"></i> Notificaciones</h3>
            <button onclick="window.marcarTodasLeidas()" class="btn-marcar-leidas">
                <i class="fa fa-check-double"></i> Marcar todas
            </button>
        </div>
        
        <div id="notificaciones-lista" class="notificaciones-lista">
            <div class="notificaciones-loading">
                <i class="fa fa-spinner fa-spin"></i> Cargando...
            </div>
        </div>
        
        <div class="notificaciones-footer">
            <a href="/notificaciones.html">Ver todas las notificaciones</a>
        </div>
    </div>
</div>

     ESTILOS DEL PANEL
     ============================================================ -->

<!-- ============================================================
     SCRIPTS DEL PANEL
     ============================================================ -->
<script>
    // ============================================================
    // INICIAR PANEL DE NOTIFICACIONES
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        iniciarNotificacionesUI();
    });
    
    async function iniciarNotificacionesUI() {
        const container = document.getElementById('notificaciones-container');
        if (!container) return;
        
        // Esperar a que notificaciones esté disponible
        if (typeof notificaciones === 'undefined' || !notificaciones) {
            console.log('⏳ Esperando que notificaciones esté disponible...');
            setTimeout(iniciarNotificacionesUI, 500);
            return;
        }
        
        // Inicializar notificaciones si no está iniciado
        if (!notificaciones.inicializado) {
            await notificaciones.iniciar();
        }
        
        // Mostrar contenedor
        container.style.display = 'block';
        
        // Renderizar notificaciones
        const lista = notificaciones.notificaciones || [];
        renderizarNotificaciones(lista);
        actualizarBadge();
        
        // Escuchar nuevas notificaciones
        notificaciones.onNuevaNotificacion(() => {
            renderizarNotificaciones(notificaciones.notificaciones);
            actualizarBadge();
        });
        
        // Escuchar eventos de actualización
        window.addEventListener('notificacion-actualizada', () => {
            renderizarNotificaciones(notificaciones.notificaciones);
            actualizarBadge();
        });
        
        window.addEventListener('notificacion-eliminada', () => {
            renderizarNotificaciones(notificaciones.notificaciones);
            actualizarBadge();
        });
        
        console.log('✅ Panel de notificaciones iniciado');
    }

    // ============================================================
    // RENDERIZAR NOTIFICACIONES
    // ============================================================
    function renderizarNotificaciones(lista) {
        const container = document.getElementById('notificaciones-lista');
        if (!container) return;
        
        if (!lista || lista.length === 0) {
            container.innerHTML = `
                <div class="notificaciones-vacio">
                    <i class="fa fa-bell-slash"></i>
                    <p>No tienes notificaciones</p>
                </div>
            `;
            return;
        }
        
        // Mostrar solo las 10 más recientes
        const mostrar = lista.slice(0, 10);
        
        container.innerHTML = mostrar.map(n => {
            const fecha = new Date(n.created_at);
            const fechaStr = fecha.toLocaleString('es-ES', {
                day: '2-digit',
                month: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            const noLeidaClass = !n.leida ? 'no-leida' : '';
            const tipo = n.tipo || 'visita';
            const dataStr = JSON.stringify(n.data || {}).replace(/"/g, '&quot;');
            
            return `
                <div class="notificacion-item ${noLeidaClass}" 
                     onclick="window.abrirNotificacion('${n.id}', '${tipo}', '${dataStr}', ${n.es_masiva || false})">
                    <div class="notificacion-header">
                        <span class="notificacion-titulo">${n.titulo || 'Notificación'}</span>
                        <span class="notificacion-fecha">${fechaStr}</span>
                    </div>
                    <div class="notificacion-mensaje">${n.mensaje || ''}</div>
                    <div>
                        <span class="notificacion-tipo tipo-${tipo}">${tipo}</span>
                        ${n.es_masiva ? '<span style="font-size: 9px; background: #f97316; color: white; padding: 2px 8px; border-radius: 20px; margin-left: 6px;">MASIVA</span>' : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    // ============================================================
    // ACTUALIZAR BADGE
    // ============================================================
    function actualizarBadge() {
        const badge = document.getElementById('notificaciones-badge');
        if (!badge) return;
        
        if (typeof notificaciones !== 'undefined' && notificaciones) {
            const count = notificaciones.contarNoLeidas();
            badge.textContent = count;
            badge.style.display = count > 0 ? 'flex' : 'none';
        } else {
            badge.style.display = 'none';
        }
    }

    // ============================================================
    // FUNCIONES GLOBALES
    // ============================================================
    
    // Alternar panel
    window.toggleNotificacionesPanel = function() {
        const panel = document.getElementById('notificaciones-panel');
        if (!panel) return;
        
        const isVisible = panel.classList.contains('show');
        if (isVisible) {
            panel.classList.remove('show');
        } else {
            panel.classList.add('show');
        }
    };
    
    // Marcar todas como leídas
    window.marcarTodasLeidas = async function() {
        if (typeof notificaciones !== 'undefined' && notificaciones) {
            await notificaciones.marcarTodasComoLeidas();
            renderizarNotificaciones(notificaciones.notificaciones);
            actualizarBadge();
            
            // Mostrar feedback
            const panel = document.getElementById('notificaciones-panel');
            if (panel && panel.classList.contains('show')) {
                // Mostrar mensaje temporal
                const lista = document.getElementById('notificaciones-lista');
                if (lista) {
                    lista.innerHTML = `
                        <div class="notificaciones-vacio">
                            <i class="fa fa-check-circle" style="color: #22c55e;"></i>
                            <p style="color: #22c55e;">Todas las notificaciones marcadas como leídas</p>
                        </div>
                    `;
                    setTimeout(() => {
                        renderizarNotificaciones(notificaciones.notificaciones);
                    }, 1500);
                }
            }
        }
    };
    
    // Abrir notificación
    window.abrirNotificacion = async function(id, tipo, dataStr, esMasiva = false) {
        // Marcar como leída
        if (typeof notificaciones !== 'undefined' && notificaciones) {
            if (esMasiva) {
                // Para notificaciones masivas, marcar como leída
                const usuario = await supabase.auth.getUser();
                if (usuario.data?.user) {
                    await supabase
                        .from('notificaciones_masivas_leidas')
                        .upsert({
                            notificacion_id: id,
                            user_id: usuario.data.user.id,
                            leida_at: new Date().toISOString()
                        }, { onConflict: 'notificacion_id,user_id' });
                }
            } else {
                await notificaciones.marcarComoLeida(id);
            }
            renderizarNotificaciones(notificaciones.notificaciones);
            actualizarBadge();
        }
        
        // Cerrar panel
        const panel = document.getElementById('notificaciones-panel');
        if (panel) panel.classList.remove('show');
        
        // Parsear data
        let data = {};
        try { data = JSON.parse(dataStr); } catch (e) {}
        
        // Redirigir según tipo
        if (data.link_url) {
            window.location.href = data.link_url;
            return;
        }
        
        if (tipo === 'visita' || tipo === 'clic') {
            if (data.producto_id) {
                window.location.href = `/producto.html?id=${data.producto_id}`;
            }
        } else if (tipo === 'pedido') {
            if (data.pedido_id) {
                window.location.href = `/mi-cuenta.html?pedido=${data.pedido_id}`;
            }
        } else if (tipo === 'aprobado' || tipo === 'rechazado') {
            window.location.href = '/mi-cuenta.html';
        } else if (tipo === 'reporte' && data.vendedor_id) {
            window.location.href = `/admin/admin-reportes.html?vendedor=${data.vendedor_id}`;
        } else {
            // Fallback: ir a notificaciones
            window.location.href = '/notificaciones.html';
        }
    };
    
    // ============================================================
    // CERRAR PANEL AL HACER CLIC FUERA
    // ============================================================
    document.addEventListener('click', function(e) {
        const container = document.getElementById('notificaciones-container');
        const panel = document.getElementById('notificaciones-panel');
        
        if (container && panel && panel.classList.contains('show') && !container.contains(e.target)) {
            panel.classList.remove('show');
        }
    });
    
    console.log('✅ Panel de notificaciones cargado');
</script>
